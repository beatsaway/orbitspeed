<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stage Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f3ecdf;
      --dim: rgba(243, 236, 223, 0.62);
      --line: rgba(243, 236, 223, 0.16);
      --card: rgba(8, 9, 12, 0.86);
      --gold: #ffe9a8;
      --bad: #f0c2b2;
      --ok: #d7eccf;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #7eb4e6; color: var(--ink); font-family: Outfit, system-ui, sans-serif; }
    body { overflow: hidden; user-select: none; -webkit-user-select: none; }
    input { user-select: text; -webkit-user-select: text; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    aside {
      position: absolute; top: 14px; left: 14px; z-index: 6;
      width: 280px; height: auto; max-height: none; overflow: visible;
      padding: 14px 14px 12px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      backdrop-filter: blur(10px);
      display: flex; flex-direction: column; gap: 8px;
    }
    .kicker {
      margin: 0; font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500; font-size: 28px; line-height: 1;
    }
    #goalLine, #costLine, #tanks { margin: 0; font-size: 0.92rem; }
    #tanks { color: var(--gold); }
    #hint { margin: 0; color: var(--dim); font-size: 0.82rem; line-height: 1.35; }
    label.ctrl { display: block; }
    label.ctrl span { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 4px; }
    label.ctrl b { font-weight: 500; color: var(--gold); }
    input[type="range"] { width: 100%; accent-color: #f3ecdf; }
    .ends { display: flex; justify-content: space-between; color: var(--dim); font-size: 0.75rem; margin-top: 2px; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1 1 0; min-width: 0; }
    button {
      font-family: Outfit, system-ui, sans-serif; font-weight: 500;
      color: #16140f; background: #f3ecdf; border: 0; border-radius: 999px;
      padding: 8px 12px; cursor: pointer;
    }
    button.ghost {
      background: transparent; color: var(--ink);
      border: 1px solid rgba(243, 236, 223, 0.28);
    }
    button:disabled { background: rgba(243, 236, 223, 0.12); color: var(--dim); cursor: default; }
    @keyframes retryPulse {
      0%, 100% { background: #f3ecdf; color: #16140f; box-shadow: 0 0 0 0 rgba(243, 236, 223, 0.45); }
      50% { background: #fff8ea; color: #16140f; box-shadow: 0 0 0 7px rgba(243, 236, 223, 0); }
    }
    button#retry.nudge:not(:disabled) {
      animation: retryPulse 1.15s ease-in-out infinite;
      border-color: transparent;
    }
    button#retry.skip:not(:disabled) {
      background: #f3ecdf;
      color: #16140f;
      border-color: transparent;
      animation: none;
    }
    #flightBtn {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6;
    }
    #quipbox {
      position: absolute; right: 14px; bottom: 14px; z-index: 5;
      max-width: min(300px, calc(100% - 320px));
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    #face { font-size: 1.6rem; line-height: 1; }
    #quip { margin: 0; font-size: 0.92rem; line-height: 1.35; }
    #hud {
      position: absolute; top: 14px; right: 14px; z-index: 6;
      min-width: 210px; padding: 10px 12px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      font-size: 0.82rem; line-height: 1.35; backdrop-filter: blur(10px);
    }
    #hud .row { display: flex; justify-content: space-between; gap: 16px; }
    #hud .row + .row { margin-top: 3px; }
    #hud .row span { color: var(--dim); }
    #hud b { font-variant-numeric: tabular-nums; font-weight: 500; }
    #hud b.ok { color: var(--ok); }
    #hud b.bad { color: var(--bad); }
    #pop {
      position: absolute; inset: 0; z-index: 8;
      display: flex; align-items: center; justify-content: center;
      background: rgba(7, 8, 12, 0.72); padding: 18px;
    }
    #pop[hidden] { display: none; }
    .card {
      width: min(360px, 100%);
      background: rgba(8, 9, 12, 0.94); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
    }
    .card h2 {
      margin: 4px 0 8px; font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500; font-size: 28px; line-height: 1;
    }
    .card p { margin: 0 0 8px; line-height: 1.45; color: var(--dim); }
    .pop-actions { display: flex; gap: 8px; margin-top: 8px; }
    .pop-actions button { flex: 1; width: auto; margin-top: 0; }
    #popNo[hidden] { display: none !important; }
    #popKicker { margin: 0 0 4px; font-size: 0.85rem; color: var(--gold); }
    #flash {
      position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 58%, rgba(255, 244, 214, 0.92), rgba(255, 110, 28, 0.38) 28%, rgba(255, 70, 20, 0) 62%);
    }
    #flash.on { animation: bangFlash 0.85s ease-out; }
    @keyframes bangFlash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="flash"></div>
  <aside>
    <p class="kicker" id="kicker">Flight 1 of 8</p>
    <p id="goalLine">Reach the line.</p>
    <div id="controls"></div>
    <p id="tanks"></p>
    <p id="hint"></p>
    <p id="costLine">This launch costs ¥0</p>
    <div class="actions">
      <button class="ghost" id="retry" type="button">Retry</button>
      <button id="launch" type="button">Launch</button>
    </div>
  </aside>
  <button class="ghost" id="flightBtn" type="button">Flight 1</button>
  <div id="quipbox"><span id="face">🙂</span><p id="quip">Set the sliders, then launch.</p></div>
  <div id="hud">
    <div class="row"><span>Height</span><b id="hudHeight">0 km</b></div>
    <div class="row"><span>Stage</span><b id="hudStage">On the pad</b></div>
    <div class="row" id="hudDropRow" hidden><span>Drop in</span><b id="hudDrop">—</b></div>
    <div class="row"><span>Budget</span><b id="hudBudget">¥0</b></div>
    <div class="row"><span>Savings</span><b id="hudSavings" class="ok">¥0</b></div>
    <div class="row"><span>Debt</span><b id="hudDebt" class="ok">¥0</b></div>
  </div>
  <div id="pop">
    <div class="card">
      <p id="popKicker"></p>
      <h2 id="popTitle"></h2>
      <div id="popBody"></div>
      <div class="pop-actions">
        <button class="ghost" id="popNo" type="button" hidden>Keep flying</button>
        <button id="popBtn" type="button">I am ready</button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="music/ctx.js"></script>
  <script src="music/music-voices.js"></script>
  <script src="music/ship-music.js"></script>
  <script src="sfx.js"></script>
  <script>

    const G = 9.81;
    const ISP = [165, 330, 160];
    const BASE = [310000, 135000, 18000];
    const PER = [11000, 4300, 3600];
    const DRY0 = 450;
    const DRY_FRAC = 0.27;
    const DRAG_AREA = 2;
    const AIR_SCALE = 8500;
    const AIR_DENSITY = 1.22;
    const PAYLOAD = 130;
    const TIME_SCALE = 12;
    function altY(metres) {
      const km = Math.max(0, metres) / 1000;
      return Math.sqrt(km) * 14;
    }
    const NZ = 0.32;
    const LEG = 0.9;
    const PAD_TOP = 0.52;
    const PAD_CLEAR = PAD_TOP + NZ + LEG;
    const BODY_R = 0.46;

    const flights = [
      {
        title: "Add a second stage",
        goal: 400,
        budget: 36,
        hint: "One tank runs out below the edge of space. A second stage carries the payload up to the line.",
        brief: "One stage cannot reach the line. Add a second stage. When the first tank is empty, it drops, and the next engine carries the payload the rest of the way up.",
        n: 1,
        fuels: [14, 11, 6],
        drop: 0,
        controls: [{ key: "n", label: "How many stages?", min: 1, max: 3, step: 1, ends: ["1", "3"] }]
      },
      {
        title: "Fuel the bottom stage",
        goal: 540,
        budget: 36,
        hint: "The first stage lifts the whole rocket. Give it more of the fuel.",
        brief: "The fuel is split across two stages. The total stays the same. Put more of it in the first stage, so the rocket can lift off.",
        n: 2,
        pool: 26,
        bottom: 6,
        drop: 0,
        controls: [{ key: "bottom", label: "Fuel in the first stage", min: 4, max: 22, step: 1, ends: ["Mostly on top", "Mostly at the bottom"] }]
      },
      {
        title: "Drop the empty tank",
        goal: 590,
        budget: 34,
        hint: "The first tank burns for a fixed time. Drop it when that fuel is gone. Earlier throws fuel away. Later, you carry an empty tank.",
        brief: "You choose when the first tank drops. The engine uses fuel on its own clock. Too soon, and fuel is still in the tank. Too late, and the empty tank stays on.",
        n: 2,
        fuels: [14, 11],
        drop: 2,
        controls: [{ key: "drop", label: "When the first tank drops", min: 1, max: 12, step: 1, ends: ["Too soon", "Hold on"] }]
      },
      {
        title: "Keep the second tank small",
        goal: 620,
        budget: 32,
        hint: "A huge second tank is heavy at lift-off. Leave it smaller.",
        brief: "The first tank stays full. If you fill the second tank as well, the rocket is heavy before it even drops a stage.",
        n: 2,
        fuels: [14, 14],
        top: 14,
        drop: 0,
        controls: [{ key: "top", label: "Fuel in the second stage", min: 2, max: 14, step: 1, ends: ["Small", "Full"] }]
      },
      {
        title: "Fill the one tank",
        goal: 60,
        budget: 24,
        hint: "This line is low, still in the air. One tank can reach it if you fill it.",
        brief: "There is only one stage. A little fuel falls short of this low line. More fuel reaches it. Extra fuel after that adds less and less height.",
        n: 1,
        bottom: 8,
        drop: 0,
        controls: [{ key: "bottom", label: "Fuel in the tank", min: 6, max: 24, step: 1, ends: ["Low", "Full"] }]
      },
      {
        title: "Do not hold the empty tank",
        goal: 730,
        budget: 36,
        hint: "This first tank also burns for a fixed time. Drop it when the fuel is gone. Too soon wastes fuel. Too late carries the empty tank.",
        brief: "Two stages, with plenty of fuel. The drop time is separate from the burn. If the tank leaves early, fuel is still in it. If it stays late, the next engine waits.",
        n: 2,
        fuels: [18, 8],
        drop: 2,
        controls: [{ key: "drop", label: "When the first tank drops", min: 1, max: 14, step: 1, ends: ["Too soon", "Hold on"] }]
      },
      {
        title: "Lift with the first stage",
        goal: 735,
        budget: 40,
        hint: "Use two stages. Put most of the fuel in the first one, and drop it when it is empty.",
        brief: "The line is higher. One stage will not reach it. Three small stages are heavy at lift-off. Two stages, with a strong first stage, can.",
        n: 1,
        bottom: 10,
        upper: [8, 5],
        drop: 0,
        controls: [
          { key: "n", label: "How many stages?", min: 1, max: 3, step: 1, ends: ["1", "3"] },
          { key: "bottom", label: "Fuel in the first stage", min: 8, max: 24, step: 1, ends: ["Small", "Large"] }
        ]
      },
      {
        title: "Two stages are enough",
        goal: 400,
        budget: 16,
        hint: "Two stages reach the line. A third stage costs more and flies lower.",
        brief: "The budget is small. One stage misses. Three stages are heavy and can put you in debt. Two stages, dropped on time, are enough.",
        n: 1,
        bottom: 8,
        upper: [6, 4],
        drop: 0,
        controls: [
          { key: "n", label: "How many stages?", min: 1, max: 3, step: 1, ends: ["1", "3"] },
          { key: "bottom", label: "Fuel in the first stage", min: 8, max: 22, step: 1, ends: ["Small", "Large"] }
        ]
      }
    ];

    const music = new ShipMusic();
    const sfx = createSfx();
    let heard = false;
    function armAudio() {
      if (heard) return;
      heard = true;
      music.start();
      music.setMood("scene1");
    }
    addEventListener("pointerdown", armAudio);

    const canvas = document.getElementById("view");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ec4ef);
    scene.fog = new THREE.Fog(0x9ecbf2, 38, 110);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1600);
    scene.add(new THREE.HemisphereLight(0xd7ecff, 0x8a7a58, 1.05));
    const sun = new THREE.DirectionalLight(0xfff3e2, 1.55);
    sun.position.set(6, 14, 8);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xf3ecdf, 0.14));

    const site = new THREE.Group();
    scene.add(site);
    const sea = new THREE.Mesh(
      new THREE.CircleGeometry(90, 48),
      new THREE.MeshStandardMaterial({ color: 0x3f86b8, roughness: 0.35, metalness: 0.12 })
    );
    sea.rotation.x = -Math.PI / 2;
    sea.position.set(0, -0.12, 22);
    site.add(sea);
    function terrainHeight(x, z) {
      const roll = Math.sin(x * 0.16) * Math.cos(z * 0.13)
        + Math.sin(x * 0.05 + z * 0.07) * 1.35
        + Math.sin(x * 0.37 + 1.7) * Math.sin(z * 0.31) * 0.55;
      const d = Math.hypot(x, z);
      const away = Math.min(1, Math.max(0, (d - 7) / 8));
      let h = roll * 1.2 * away;
      if (z > 12) h -= (z - 12) * 0.055 * away;
      return h;
    }
    const groundGeo = new THREE.PlaneGeometry(96, 96, 72, 72);
    groundGeo.rotateX(-Math.PI / 2);
    const gPos = groundGeo.attributes.position;
    const gCol = new Float32Array(gPos.count * 3);
    for (let i = 0; i < gPos.count; i++) {
      const x = gPos.getX(i);
      const z = gPos.getZ(i);
      const h = terrainHeight(x, z);
      gPos.setY(i, h);
      const mix = Math.sin(x * 0.21 + 0.4) * Math.cos(z * 0.18);
      let r = 0.24, g = 0.22, b = 0.16;
      if (h < -0.15) { r = 0.1; g = 0.18; b = 0.22; }
      else if (mix > 0.45) { r = 0.38; g = 0.36; b = 0.32; }
      else if (mix < -0.25) { r = 0.2; g = 0.34; b = 0.16; }
      else if (mix > 0.1) { r = 0.42; g = 0.36; b = 0.22; }
      gCol[i * 3] = r;
      gCol[i * 3 + 1] = g;
      gCol[i * 3 + 2] = b;
    }
    groundGeo.setAttribute("color", new THREE.BufferAttribute(gCol, 3));
    groundGeo.computeVertexNormals();
    site.add(new THREE.Mesh(
      groundGeo,
      new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0.02 })
    ));
    const pad = new THREE.Mesh(
      new THREE.CylinderGeometry(3.1, 3.45, 0.46, 40),
      new THREE.MeshStandardMaterial({ color: 0x2c3848, metalness: 0.4, roughness: 0.5 })
    );
    pad.position.y = 0.23;
    site.add(pad);
    const deck = new THREE.Mesh(
      new THREE.CylinderGeometry(2.15, 2.15, 0.08, 32),
      new THREE.MeshStandardMaterial({ color: 0x465366, metalness: 0.55, roughness: 0.35 })
    );
    deck.position.y = 0.48;
    site.add(deck);
    function groundRing(inner, outer, y, color) {
      const mark = new THREE.Mesh(
        new THREE.RingGeometry(inner, outer, 48),
        new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide })
      );
      mark.rotation.x = -Math.PI / 2;
      mark.position.y = y;
      site.add(mark);
    }
    groundRing(1.5, 1.68, 0.53, 0xf3ecdf);
    groundRing(2.55, 2.72, 0.47, 0xf3e6c0);
    const trench = new THREE.Mesh(
      new THREE.BoxGeometry(1.15, 0.18, 8),
      new THREE.MeshStandardMaterial({ color: 0x070b10, roughness: 0.85 })
    );
    trench.position.set(0, 0.02, 3.6);
    site.add(trench);

    const starArr = new Float32Array(420 * 3);
    for (let i = 0; i < 420; i++) {
      const r = 30 + Math.random() * 70;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(Math.random() * 2 - 1);
      starArr[i * 3] = Math.sin(ph) * Math.cos(th) * r;
      starArr[i * 3 + 1] = Math.abs(Math.cos(ph)) * 40 + 6;
      starArr[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * r;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.BufferAttribute(starArr, 3));
    const groundStarMat = new THREE.PointsMaterial({ color: 0xf3ecdf, size: 0.08, transparent: true, opacity: 0, fog: false });
    scene.add(new THREE.Points(starGeo, groundStarMat));
    const skyCanvas = document.createElement("canvas");
    skyCanvas.width = 8;
    skyCanvas.height = 512;
    {
      const pen = skyCanvas.getContext("2d");
      const wash = pen.createLinearGradient(0, 0, 0, 512);
      wash.addColorStop(0, "#2f74c4");
      wash.addColorStop(0.42, "#6aadec");
      wash.addColorStop(0.72, "#b7dcfa");
      wash.addColorStop(0.88, "#d7ecff");
      wash.addColorStop(1, "#c5ddf4");
      pen.fillStyle = wash;
      pen.fillRect(0, 0, 8, 512);
    }
    const skyTex = new THREE.CanvasTexture(skyCanvas);
    skyTex.flipY = false;
    const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 24, 16), skyMat);
    sky.renderOrder = -1;
    sky.frustumCulled = false;
    scene.add(sky);

    const goalRing = new THREE.Mesh(
      new THREE.TorusGeometry(3.4, 0.035, 8, 64),
      new THREE.MeshBasicMaterial({ color: 0xffe9a8 })
    );
    goalRing.rotation.x = Math.PI / 2;
    scene.add(goalRing);
    const spaceRing = new THREE.Mesh(
      new THREE.TorusGeometry(9.2, 0.018, 8, 96),
      new THREE.MeshBasicMaterial({ color: 0x9ecbff, transparent: true, opacity: 0.9, fog: false })
    );
    spaceRing.rotation.x = Math.PI / 2;
    scene.add(spaceRing);
    function makeSkyLabel(text) {
      const board = document.createElement("canvas");
      board.width = 640;
      board.height = 128;
      const pen = board.getContext("2d");
      pen.clearRect(0, 0, board.width, board.height);
      pen.font = "500 54px sans-serif";
      pen.fillStyle = "#d7ebff";
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillText(text, 320, 64);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(board), transparent: true, depthWrite: false, fog: false
      }));
      sprite.scale.set(16, 3.2, 1);
      return sprite;
    }
    const spaceLabel = makeSkyLabel("Edge of space  ·  100 km");
    scene.add(spaceLabel);
    const cloudTex = document.createElement("canvas");
    cloudTex.width = cloudTex.height = 128;
    {
      const pen = cloudTex.getContext("2d");
      const wash = pen.createRadialGradient(64, 60, 6, 64, 64, 62);
      wash.addColorStop(0, "rgba(255,255,255,0.72)");
      wash.addColorStop(0.28, "rgba(232,240,246,0.38)");
      wash.addColorStop(0.62, "rgba(214,226,236,0.12)");
      wash.addColorStop(1, "rgba(214,226,236,0)");
      pen.fillStyle = wash;
      pen.beginPath();
      pen.ellipse(64, 68, 46, 28, 0, 0, Math.PI * 2);
      pen.fill();
      pen.beginPath();
      pen.ellipse(46, 62, 24, 18, 0, 0, Math.PI * 2);
      pen.fill();
      pen.beginPath();
      pen.ellipse(84, 60, 22, 16, 0, 0, Math.PI * 2);
      pen.fill();
    }
    const cloudMap = new THREE.CanvasTexture(cloudTex);
    function cloudBank(km, clusters) {
      const y = PAD_CLEAR + altY(km * 1000);
      for (let c = 0; c < clusters; c++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = 2.2 + Math.random() * 3.2;
        const cx = Math.cos(ang) * rad;
        const cz = Math.sin(ang) * rad;
        const blobs = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < blobs; i++) {
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: cloudMap, transparent: true, depthWrite: false, fog: false,
            opacity: 0.28 + Math.random() * 0.22, color: 0xeef4f8
          }));
          const w = 2.4 + Math.random() * 2.4;
          sprite.scale.set(w, w * (0.42 + Math.random() * 0.22), 1);
          sprite.position.set(
            cx + (Math.random() - 0.5) * 2.2,
            y + (Math.random() - 0.5) * 0.55,
            cz + (Math.random() - 0.5) * 2.2
          );
          scene.add(sprite);
        }
      }
    }
    cloudBank(4, 4);
    cloudBank(14, 3);
    cloudBank(32, 3);
    cloudBank(58, 2);
    const highStarArr = new Float32Array(260 * 3);
    for (let i = 0; i < 260; i++) {
      const r = 36 + Math.random() * 48;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(Math.random() * 2 - 1);
      highStarArr[i * 3] = Math.sin(ph) * Math.cos(th) * r;
      highStarArr[i * 3 + 1] = Math.cos(ph) * r * 0.55;
      highStarArr[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * r;
    }
    const highStarGeo = new THREE.BufferGeometry();
    highStarGeo.setAttribute("position", new THREE.BufferAttribute(highStarArr, 3));
    const highStarMat = new THREE.PointsMaterial({ color: 0xf3ecdf, size: 0.09, transparent: true, opacity: 0, fog: false });
    const highStars = new THREE.Points(highStarGeo, highStarMat);

    function design() {
      const f = flights[index];

      else if (f.fuels) fuels = f.fuels.slice();
      else fuels = [setup.bottom].concat(f.upper || [8, 5]);
      if (f.controls.some(c => c.key === "bottom")) fuels[0] = setup.bottom;
      if (f.controls.some(c => c.key === "top")) fuels[1] = setup.top;
      return { n, fuels: fuels.slice(0, n), drop: setup.drop };

    function launchCost(d) {

      const v = Math.round(Number(n) * 10) / 10;

    function paintHud(heightKm) {

      if (counting) {

        const fuelT = flying.stages[0].fuel / 1000;
        const text = left.toFixed(1) + " s";
        if (dropLabel) dropLabel.textContent = text;
        if (dropRead) dropRead.textContent = fuelT > 0.05 ? text + " · " + tons(fuelT) : text + " · empty";
        stage.textContent = fuelT > 0.05 ? "Fuel still in the tank" : "Tank empty, still attached";
      } else if (flying && flying.timedDrop && mode === "fly") {
        if (dropLabel) dropLabel.textContent = "Dropped";
        if (dropRead) dropRead.textContent = "Dropped";
        const i = Math.min(flying.idx, flying.n - 1);
        const lit = flying.litKm[i];
        stage.textContent = (i + 1) + " of " + flying.n + (i > 0 ? " · from " + Math.round(lit) + " km" : "");
      } else if (!flying) {
        stage.textContent = "On the pad";

      } else {

    function spend(amount) {
      let left = amount;
      if (budget >= left) { budget -= left; left = 0; }

        else { left -= savings; savings = 0; debt += left; }
      }
      paintHud(flying ? flying.h / 1000 : 0);

    function bank() {

    function makeStages(d) {

    function winLine() {

      if (index === 1) return "The first stage was strong enough to lift the rest.";
      if (index === 2 || index === 5) return "The first tank dropped when its fuel was gone, so the next engine was not late and no fuel was thrown away.";
      if (index === 3) return "The second tank stayed small, so the first stage could lift the rocket.";
      if (index === 4) return "One full enough tank reached this low line.";
      if (index === 7) return "Two stages reached the line, and the launch stayed inside the budget.";
      return "Two stages, with the fuel in the first one, reached the higher line.";
    }
    function loseLine(km) {
      const f = flights[index];

      if ((index === 0 || index === 7) && d.n === 1) return "One tank ran out. Add a second stage.";
      if (index === 0 && d.n === 3) return "Three stages were heavy at lift-off. Try two.";
      if (index === 1 || index === 4) return "The first tank did not have enough fuel.";
      if (index === 2 || index === 5) {
        if (flying && flying.droppedFuelT > 0.05) return "The tank dropped while fuel was still in it. That fuel was wasted. Drop it when the burn is finished.";
        return "The tank was already empty, and it stayed on too long. Drop it when the fuel is gone.";
      }
      if (index === 3) return "The second tank is too full. Make it smaller.";
      if (d.n === 1) return "One stage cannot reach " + f.goal + " km.";
      if (d.n === 3) return "Three stages were too heavy at the start. Two stages are enough.";
      return "You reached " + km.toFixed(0) + " km. The line is " + f.goal + " km. Put more fuel in the first stage.";
    }
    function savingLine() {
      if (!flying || !flying.won) return "";
      const f = flights[index];
      const d = design();
      const top = Math.round(flying.maxH / 1000);
      if (top <= f.goal) return "";
      const spent = launchCost(d);
      let lean = null;
      if (index === 3 && d.fuels[1] > 2) {
        lean = { cost: launchCost({ n: 2, fuels: [14, 2] }), text: "A second tank of " + tons(2) + " still clears " + f.goal + " km." };
      } else if (index === 4 && d.fuels[0] > 11) {
        lean = { cost: launchCost({ n: 1, fuels: [11] }), text: "A tank of " + tons(11) + " still reaches " + f.goal + " km." };
      } else if (index === 6 && d.n === 2 && d.fuels[0] > 14) {
        lean = { cost: launchCost({ n: 2, fuels: [14, 8] }), text: "Two stages, with " + tons(14) + " in the first tank, still reach " + f.goal + " km." };
      } else if (index === 7 && d.n === 2 && d.fuels[0] > 8) {
        lean = { cost: launchCost({ n: 2, fuels: [8, 6] }), text: "Two stages, with " + tons(8) + " in the first tank, still reach " + f.goal + " km." };
      }
      if (!lean || lean.cost >= spent - 0.05) return "";
      const saved = Math.round((spent - lean.cost) * 10) / 10;
      return "You reached " + f.goal + " km, and the payload went on to " + top + " km. " + lean.text + " That would have cost " + yen(saved) + " less.";
    }
    function climbLine() {
      if (!flying) return "";
      const top = Math.round(flying.maxH / 1000);
      if (flying.litKm && flying.litKm[1] != null) {
        return "The second stage lit at " + Math.round(flying.litKm[1]) + " km and carried the payload to " + top + " km.";
      }
      if (flying.burnKm != null) {
        return "The tank emptied at " + Math.round(flying.burnKm) + " km. The payload coasted to " + top + " km.";
      }
      return "";
    }
    function dropStage() {
      const fly = flying;
      const spent = fly.stages[fly.idx];
      if (!spent) return;
      const leftT = spent.fuel / 1000;
      fly.droppedFuelT = leftT;
      const km = fly.h / 1000;
      scraps.push({ h: fly.h, v: fly.v * 0.4, spin: 0, mesh: null, localY: 0 });
      fly.idx++;
      fly.releaseAt = null;
      fly.litKm[fly.idx] = km;
      if (leftT > 0.05) say("😐", "Tank dropped with " + tons(leftT) + " of fuel still in it. That fuel is gone.");
      else if (fly.idx === 1) say("🙂", "Second stage lit at " + Math.round(km) + " km. The first tank was empty.");
      else say("🙂", "Empty stage dropped.");
    }
    function stepPhysics(dt) {
      const fly = flying;
      if (!fly || fly.done) return;
      let mass = PAYLOAD;
      for (let i = fly.idx; i < fly.stages.length; i++) {
        mass += fly.stages[i].dry + Math.max(0, fly.stages[i].fuel);
      }
      const s = fly.stages[fly.idx];
      let thrust = 0;
      if (s && s.fuel > 0) {
        const cap = s.burn * dt;
        const burn = Math.min(s.fuel, cap);
        s.fuel -= burn;
        thrust = s.thrust * (burn / (cap || 1));
        if (s.fuel <= 0.05) {
          s.fuel = 0;
          if (fly.burnKm == null) fly.burnKm = fly.h / 1000;
          if (fly.timedDrop && fly.idx === 0 && !fly.saidEmpty && fly.watch < fly.dropWait - 0.15) {
            fly.saidEmpty = true;
            say("😐", "The tank is empty, and it is still attached until " + fly.dropWait + " s.");
          }
        }
      }
      const still = fly.stages[fly.idx];
      const burnedOut = still && still.fuel <= 0 && fly.idx < fly.stages.length - 1 && !(fly.timedDrop && fly.idx === 0);
      if (fly.idx < fly.stages.length - 1 && burnedOut) dropStage();
      const rho = AIR_DENSITY * Math.exp(-Math.max(0, fly.h) / AIR_SCALE);
      const drag = 0.5 * rho * Math.abs(fly.v) * fly.v * DRAG_AREA;
      fly.v += (thrust / mass - G - drag / mass) * dt;
      fly.h += fly.v * dt;
      fly.thrusting = thrust > 1000;
      if (fly.h > fly.maxH) fly.maxH = fly.h;
      if (fly.h >= fly.goal && !fly.won) {
        fly.won = true;
        say("🙂", "Past the line. Skip if you do not want to watch the rest of the climb.");
        setRetryMode("skip");
      }
      if (fly.won && fly.v <= 0) {
        fly.done = true;
        finishFlight();
        return;
      }
      if (!fly.saidSpace && fly.idx >= 1 && fly.h >= 100000 && !fly.won) {
        fly.saidSpace = true;
        say("🙂", "Past the edge of space. The second stage is still carrying the payload up.");
      }
      if (!fly.won && !fly.falling && fly.v < -1 && fly.t > 1 && fly.h < fly.goal) {
        fly.falling = true;
        const tilt = rocket.rotation.z;
        const side = Math.abs(tilt) > 0.05 ? Math.sign(tilt) : (Math.random() < 0.5 ? -1 : 1);
        fly.tumble = {
          z: Math.abs(tilt) > 0.05 ? tilt : side * 0.1,
          spin: side * (0.55 + Math.random() * 0.35),
          age: 0
        };
        say("😐", "Coming back down.");
      }
      scraps.forEach(sc => {
        sc.v -= G * dt;
        sc.h += sc.v * dt;
        sc.spin += dt * 1.4;
      });
      if (fly.h <= 0 && fly.t > 0.6 && !fly.won) {
        fly.h = 0;
        fly.v = 0;
        fly.done = true;
        fly.crashed = true;
        finishFlight();
      }
      fly.t += dt;
      fly.clock += dt;
    }
    function showFuel(unit, fuelKg) {
      if (!unit || !unit.userData.fuel) return;
      const frac = fuelKg / Math.max(1, unit.userData.fuelKg0);
      const f = Math.max(0, Math.min(1, frac));
      const show = f > 0.03;
      unit.userData.fuel.visible = show;
      unit.userData.core.visible = show;
      const sy = Math.max(0.02, show ? f : 0.02);
      unit.userData.fuel.scale.y = sy;
      unit.userData.fuel.position.y = unit.userData.fullH * sy / 2;
      unit.userData.core.scale.y = sy;
      unit.userData.core.position.y = unit.userData.fuel.position.y;
    }
    function detachSpent() {
      while (visualIdx < (flying ? flying.idx : 0) && units[visualIdx]) {
        const unit = units[visualIdx];
        const localY = unit.position.y;
        if (flying && flying.stages[visualIdx]) showFuel(unit, flying.stages[visualIdx].fuel);
        if (unit.userData.plume) unit.userData.plume.visible = false;
        rocket.remove(unit);
        scene.add(unit);
        const sc = scraps[visualIdx];
        if (sc) {
          sc.mesh = unit;
          sc.localY = localY;
          unit.position.set(0.85, PAD_CLEAR + altY(sc.h) + localY, 0.2);
        }
        visualIdx++;
        sfx.drop();
      }
    }
    function paintFuel() {
      if (!flying) return;
      for (let i = flying.idx; i < units.length; i++) {
        const u = units[i];
        if (!u || u.parent !== rocket) continue;
        showFuel(u, flying.stages[i].fuel);
        const plume = u.userData.plume;
        const parts = plume.userData;
        plume.visible = i === flying.idx && flying.thrusting;
        if (plume.visible) {
          const t = performance.now() * 0.001;
          const flick = 0.82 + Math.sin(t * 46) * 0.18;
          parts.outer.scale.set(flick, 0.75 + Math.sin(t * 31) * 0.2, flick);
          parts.mid.scale.y = 0.85 + Math.sin(t * 52) * 0.2;
          parts.heart.scale.y = 0.9 + Math.sin(t * 60) * 0.15;
          parts.light.intensity = 3.2 + Math.sin(t * 40) * 1.4;
          const arr = parts.emberArr;
          for (let k = 0; k < 70; k++) {
            arr[k * 3 + 1] -= (5 + (k % 5)) * frameDt;
            if (arr[k * 3 + 1] < -2.6) resetEmber(arr, k, false);
          }
          parts.embers.geometry.attributes.position.needsUpdate = true;
        } else {
          parts.light.intensity = 0;
        }
      }
      scraps.forEach(sc => {
        if (!sc.mesh) return;
        sc.mesh.position.y = PAD_CLEAR + altY(sc.h) + sc.localY;
        sc.mesh.rotation.z = sc.spin;
      });
    }

    function fit() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    fit();
    addEventListener("resize", fit);

    const DOT = Math.PI / 4;
    let yaw = DOT;
    let pitch = 0.32;
    let zoom = 1;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointercancel", () => { dragging = false; });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      yaw -= (e.clientX - lastX) * 0.008;
      pitch = Math.max(-0.2, Math.min(1.05, pitch + (e.clientY - lastY) * 0.006));
      lastX = e.clientX;
      lastY = e.clientY;
    });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom = Math.max(0.65, Math.min(1.85, zoom + e.deltaY * 0.001));
    }, { passive: false });
    function frameCamera() {
      const base = flying ? PAD_CLEAR + altY(Math.max(0, flying.h)) : PAD_CLEAR;
      const live = flying && units[flying.idx] ? units[flying.idx].position.y : 0;
      const remain = Math.max(1.6, stackTop - live);
      const y = base + live + remain * 0.42;
      const dist = Math.max(mode === "fly" ? 13.5 : 8.6, remain * 2.15) * zoom;
      const cp = Math.cos(pitch);
      const x = rocket.position.x || 0;
      camera.position.set(
        x + dist * Math.sin(yaw) * cp,
        y + dist * Math.sin(pitch),
        dist * Math.cos(yaw) * cp
      );
      camera.lookAt(x, y, 0);
      if (!dragging && mode !== "fly") yaw += 0.002;
    }

    let last = performance.now();
    let acc = 0;
    let frameDt = 0.016;
    function clearBoom() {
      if (!boom) return;
      scene.remove(boom);
      boom.traverse(child => { if (child.geometry) child.geometry.dispose(); });
      boom = null;
      rocket.visible = true;
    }
    function spawnBoom() {
      clearBoom();
      boom = new THREE.Group();
      boom.position.set(rocket.position.x, rocket.position.y, rocket.position.z);
      const fire = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0xfff6d8, transparent: true, side: THREE.DoubleSide, depthWrite: false })
      );
      const mid = new THREE.Mesh(
        new THREE.SphereGeometry(0.85, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0xff7a18, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false })
      );
      const smoke = new THREE.Mesh(
        new THREE.SphereGeometry(1.15, 14, 10),
        new THREE.MeshBasicMaterial({ color: 0x6a5044, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false })
      );
      const wave = new THREE.Mesh(
        new THREE.RingGeometry(0.1, 0.24, 40),
        new THREE.MeshBasicMaterial({ color: 0xfff3c4, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false })
      );
      wave.rotation.x = -Math.PI / 2;
      wave.position.y = 0.05;
      boom.add(fire, mid, smoke, wave);
      const bits = [];
      for (let i = 0; i < 28; i++) {
        const bit = new THREE.Mesh(
          new THREE.BoxGeometry(0.08 + Math.random() * 0.16, 0.06, 0.06 + Math.random() * 0.12),
          new THREE.MeshStandardMaterial({
            color: i % 3 === 0 ? 0xd24b3c : i % 3 === 1 ? 0xf2f5f8 : 0x2c6bed,
            emissive: 0xff6a22, emissiveIntensity: 0.4
          })
        );
        const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9 + 0.2, Math.random() - 0.5).normalize();
        bit.userData.vel = dir.multiplyScalar(6 + Math.random() * 11);
        bit.userData.spin = (Math.random() - 0.5) * 8;
        boom.add(bit);
        bits.push(bit);
      }
      const light = new THREE.PointLight(0xfff1c2, 18, 22);
      boom.add(light);
      boom.userData = { fire, mid, smoke, wave, bits, light, age: 0 };
      scene.add(boom);
      rocket.visible = false;
      const flash = document.getElementById("flash");
      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");
    }
    function stepBoom(dt) {
      if (!boom) return;
      const b = boom.userData;
      b.age += dt;
      const k = Math.max(0, 1 - b.age / 2.4);
      const grow = Math.min(2.4, b.age * 3.4);
      b.fire.scale.setScalar(1 + grow);
      b.mid.scale.setScalar(1 + grow * 1.25);
      b.smoke.scale.setScalar(1 + grow * 1.05);
      b.fire.material.opacity = Math.max(0, 1 - b.age * 1.15);
      b.mid.material.opacity = 0.92 * k;
      b.smoke.material.opacity = 0.5 * Math.max(0, 1 - b.age * 0.12);
      b.wave.scale.setScalar(1 + b.age * 14);
      b.wave.material.opacity = 0.85 * k;
      b.light.intensity = 18 * k;
      b.bits.forEach(bit => {
        bit.userData.vel.y -= 9 * dt;
        bit.position.addScaledVector(bit.userData.vel, dt);
        bit.rotation.z += bit.userData.spin * dt;
        if (bit.position.y < 0.05) {
          bit.position.y = 0.05;
          bit.userData.vel.y *= -0.25;
          bit.userData.vel.x *= 0.7;
          bit.userData.vel.z *= 0.7;
        }
      });
    }
    function paintRush() {
      const speed = flying && mode === "fly" ? flying.v : 0;
      const moving = Math.abs(speed) > 20;
      rushMat.opacity = moving ? Math.min(0.42, 0.12 + Math.abs(speed) / 4200) : 0;
      const dir = speed >= 0 ? 1 : -1;
      if (moving) rushScroll += dir * Math.abs(speed) * frameDt * 0.02;
      const len = moving ? 0.55 + Math.min(2.1, Math.abs(speed) / 900) : 1;
      const baseY = rocket.position.y + stackTop * 0.35;
      const span = 22;
      for (let i = 0; i < RUSH_N; i++) {
        const seed = rushSeeds[i];
        seed.bar.visible = moving;
        if (!moving) continue;
        let y = seed.y * span - rushScroll;
        y = ((y % span) + span) % span - span / 2;
        seed.bar.position.set(rocket.position.x + seed.x, baseY + y, seed.z);
        seed.bar.scale.y = len;
      }
    }
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      frameDt = dt;
      if (mode === "fly" && flying && !flying.done && !paused) {
        flying.watch += dt;
        acc += dt * TIME_SCALE * (flying.falling ? 2.2 : 1);
        while (acc >= 0.04) {
          stepPhysics(0.04);
          acc -= 0.04;
          if (!flying || flying.done) break;
        }
        if (flying && !flying.done && flying.timedDrop && flying.idx === 0 && flying.watch >= flying.dropWait - 0.001) {
          dropStage();
        }
        if (flying && !flying.done) {
          rocket.position.y = PAD_CLEAR + altY(flying.h);
          if (flying.falling && flying.tumble) {
            const tb = flying.tumble;
            tb.age += dt;
            const ramp = 0.25 + tb.age * tb.age * 2.4;
            const rate = Math.abs(tb.spin) * ramp;
            tb.z += tb.spin * ramp * dt;
            rocket.rotation.z = tb.z;
            rocket.rotation.x = Math.sin(tb.age * 1.4) * Math.min(1.15, tb.age * 0.45);
            sfx.spin(Math.min(1, rate / 7.5));
            if (!flying.won && flying.h > 40 && rate > 7.5) {
              flying.done = true;
              flying.crashed = true;
              flying.airburst = true;
              finishFlight();
            }
          } else if (flying.thrusting) {
            const t = now * 0.001;
            rocket.rotation.z = Math.sin(t * 18) * 0.045;
            rocket.rotation.x *= 0.8;
            rocket.position.x = Math.sin(t * 22) * 0.06;
            sfx.spinStop();
          } else {
            rocket.rotation.z *= 0.8;
            rocket.rotation.x *= 0.8;
            rocket.position.x *= 0.8;
            sfx.spinStop();
          }
          detachSpent();
          paintFuel();
          paintHud(flying.h / 1000);
        }
      } else if (mode === "pad") {
        rocket.rotation.y += dt * 0.25;
      }
      if (flying && flying.done) {
        detachSpent();
        paintFuel();
      }
      stepBoom(dt);
      paintRush();
      music.update();
      frameCamera();
      highStars.position.copy(camera.position);
      sky.position.copy(camera.position);
      const alt = flying ? flying.h : 0;
      groundStarMat.opacity = Math.max(0, Math.min(0.8, (alt - 18000) / 40000));
      const skyMix = Math.max(0, Math.min(1, alt / 90000));
      skyMat.color.setRGB(1 - skyMix * 0.62, 1 - skyMix * 0.48, 1 - skyMix * 0.22);
      highStarMat.opacity = flying ? Math.max(0, Math.min(0.95, (flying.h - 20000) / 40000)) : 0;
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    const cheatWord = "skiplevel";
    let cheatBuf = "";
    addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
      cheatBuf = (cheatBuf + e.key.toLowerCase()).slice(-cheatWord.length);
      if (cheatBuf !== cheatWord) return;
      cheatBuf = "";
      sfx.quiet();
      paused = false;
      flying = null;
      mode = "pad";
      document.getElementById("pop").hidden = true;
      document.getElementById("popNo").hidden = true;
      popNext = null;
      if (index >= flights.length - 1) {
        bank();
        say(debt > 0 ? "😟" : "🙂", debt > 0
          ? "You finished, and there is still debt of " + yen(debt) + "."
          : "You finished. Savings " + yen(savings) + ".");
        return;
      }
      loadFlight(index + 1);
    });

    buildRocket({ n: 2, fuels: [14, 11], drop: 0 });
    frameCamera();
    openPop(
      "Rocket stages",
      "Stage Drop",
      [
        "A stage is a fuel tank and an engine.",
        "The blue in each tank is the fuel. Some flights let you change how full a tank is.",
        "Light the bottom stage first. When its tank is empty, drop it, and the next engine carries the payload on up.",
        "The pale ring is the edge of space, 100 km up. The gold ring is the line the payload has to reach.",
        "Each launch costs money. If the budget runs out, the extra becomes debt."
      ],
      "I am ready",
      () => loadFlight(0)
    );
    requestAnimationFrame(frame);
  </script>
</body>
</html>
