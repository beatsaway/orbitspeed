<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Pilot</title>
<style>
  :root {
    color-scheme: dark;
    --gold: #e6c27a;
    --ink: #e8eef6;
    --dim: #9aa8bc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05060a;
    overflow: hidden;
    font-family: "Segoe UI", "Avenir Next", "Trebuchet MS", sans-serif;
    color: var(--ink);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .overlay {
    position: fixed;
    z-index: 4;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 5.5rem 1.25rem 8.5rem;
    background: rgba(5, 7, 12, 0.62);
    backdrop-filter: blur(6px);
  }
  .overlay[hidden] { display: none; }
  .card {
    width: min(38rem, 100%);
    max-height: min(70vh, 36rem);
    overflow: auto;
    background: rgba(10, 14, 22, 0.94);
    border: 1px solid rgba(230, 194, 122, 0.38);
    border-radius: 1.25rem;
    padding: 1.6rem 1.55rem 1.3rem;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
  }
  .kicker {
    margin: 0 0 0.35rem;
    color: var(--gold);
    letter-spacing: 0.28em;
    font-size: 0.72rem;
    font-weight: 700;
  }
  h1, h2 { margin: 0; font-weight: 650; letter-spacing: -0.03em; }
  h1 { font-size: clamp(2rem, 5vw, 2.8rem); }
  h2 { font-size: 1.7rem; }
  .route {
    margin: 0.45rem 0 0;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .card p { color: #c5d0de; line-height: 1.5; }
  .ending-art {
    display: block;
    width: 100%;
    max-height: 11rem;
    object-fit: cover;
    border-radius: 0.8rem;
    margin: 0.75rem 0 0.15rem;
    border: 1px solid rgba(230, 194, 122, 0.28);
  }
  #coach, #coachShow {
    position: fixed;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
  }
  #coach {
    width: min(340px, calc(100vw - 24px));
    padding: 12px 14px 8px;
    border: 1px solid rgba(230, 194, 122, 0.85);
    border-radius: 14px;
    background: rgba(8, 12, 20, 0.94);
    color: #f4f7fb;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    font-size: 0.95rem;
    line-height: 1.4;
  }
  #coach::before {
    content: "";
    position: absolute;
    top: -7px;
    left: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    background: rgba(8, 12, 20, 0.94);
    border-left: 1px solid rgba(230, 194, 122, 0.85);
    border-top: 1px solid rgba(230, 194, 122, 0.85);
    transform: rotate(45deg);
  }
  #coachText { margin: 0 0 10px; min-height: 3.2em; }
  #coachNav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #coachBack, #coachNext {
    border: 1px solid rgba(230, 194, 122, 0.45);
    background: transparent;
    color: #e8eef6;
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  #coachNext { background: var(--gold); color: #1c1408; border-color: transparent; font-weight: 650; }
  #coachBack:disabled { opacity: 0.35; cursor: default; }
  #coachCount { font-size: 0.78rem; color: rgba(232, 238, 246, 0.62); }
  #coachHide {
    margin-top: 6px;
    padding: 2px 8px;
    border: 0;
    background: transparent;
    color: rgba(232, 238, 246, 0.62);
    font: inherit;
    cursor: pointer;
  }
  #coachShow {
    width: auto;
    border-radius: 999px;
    background: rgba(8, 12, 20, 0.94);
    border: 1px solid rgba(230, 194, 122, 0.85);
    color: var(--gold);
    font-size: 0.85rem;
    padding: 6px 12px;
  }
  @media (max-width: 760px) {
    #coach, #coachShow { top: 168px; }
  }
  button:disabled { opacity: 0.38; cursor: default; }
  .flight-btns {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    display: flex;
    gap: 0.45rem;
  }
  .mission-btn {
    padding: 0.42rem 0.95rem;
    background: rgba(8, 12, 20, 0.88);
    color: var(--gold);
    border-color: rgba(230, 194, 122, 0.55);
    letter-spacing: 0.16em;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .mission-btn[hidden] { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.4rem; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
    padding: 0.72rem 1.15rem;
    border: 1px solid transparent;
  }
  button.primary {
    background: var(--gold);
    color: #1c1408;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border-color: rgba(255, 255, 255, 0.2);
  }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .touch {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    justify-content: center;
    gap: 0.7rem;
    padding: 0.7rem 0.8rem calc(0.7rem + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .touch button {
    pointer-events: auto;
    min-width: 5.6rem;
    min-height: 3.3rem;
    background: rgba(8, 12, 20, 0.82);
    color: var(--ink);
    border-color: rgba(230, 194, 122, 0.45);
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  @media (pointer: coarse) { .touch { display: flex; } }
  @media (max-width: 760px) {
    .flight-btns {
      top: 8px;
      left: 12px;
      transform: none;
    }
    .mission-btn { letter-spacing: 0.08em; }
    #hud {
      font-size: 0.68rem;
      min-width: 0;
      max-width: 48vw;
      padding: 6px 8px;
    }
    #control {
      left: 10px;
      right: 10px;
      max-width: none;
      font-size: 0.95rem;
    }
    #control .emoji { font-size: 2.2rem; }
  }
  #hud {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 8;
    min-width: 196px;
    padding: 8px 12px;
    background: rgba(8, 12, 20, 0.9);
    border: 1px solid rgba(230, 194, 122, 0.35);
    border-radius: 12px;
    font-size: 0.8rem;
    line-height: 1.35;
  }
  #hud .hud-row { display: flex; justify-content: space-between; gap: 14px; }
  #hud .hud-row + .hud-row { margin-top: 3px; }
  #hud .hud-row span { color: var(--dim); }
  #hud .hud-row b { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 650; }
  #hud .hud-row b.ok { color: #8fd0aa; }
  #hud .hud-row b.bad { color: #ff8d7a; }
  #control {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 8;
    pointer-events: none;
    max-width: min(420px, calc(100% - 32px));
    padding: 12px 16px;
    background: rgba(8, 12, 20, 0.92);
    border: 1px solid rgba(230, 194, 122, 0.4);
    border-radius: 14px;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  #control .emoji {
    font-size: 2.7rem;
    vertical-align: middle;
    margin-right: 8px;
    line-height: 1;
  }
  #control .caret {
    display: inline-block;
    color: var(--gold);
    animation: caretBlink 0.7s step-end infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }
  @media (pointer: coarse) {
    #control { bottom: 96px; max-width: min(420px, calc(100% - 24px)); }
  }
  #introPopup {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(5, 7, 12, 0.72);
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
  }
  #introPopup.show { display: flex; }
  #introPopup .popup-box {
    width: min(34rem, 100%);
    max-height: min(92vh, 42rem);
    overflow: auto;
    background: rgba(10, 14, 22, 0.96);
    border: 1px solid rgba(230, 194, 122, 0.4);
    border-radius: 1.25rem;
    padding: 1.5rem 1.4rem 1.2rem;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
  }
  .brief-art {
    display: block;
    width: 100%;
    height: 10.5rem;
    object-fit: cover;
    border-radius: 0.75rem;
    margin: 0 0 0.85rem;
    border: 1px solid rgba(230, 194, 122, 0.28);
    background: #061018;
  }
  .brief-date { color: var(--gold); letter-spacing: 0.08em; font-size: 0.78rem; font-weight: 700; margin: 0 0 0.35rem; }
  .brief-head { display: flex; align-items: center; gap: 10px; margin-bottom: 0.7rem; }
  .brief-face { font-size: 2.2rem; line-height: 1; }
  .brief-name { margin: 0; font-size: 1.45rem; font-weight: 650; }
  .brief-head h1 { font-size: 1.55rem; }
  .brief-body { min-height: 4.6em; white-space: pre-wrap; margin: 0; color: #d5deea; line-height: 1.5; }
  @media (max-width: 760px) {
    .brief-art { height: 7.5rem; }
  }
  #popupOk {
    display: none;
    margin-top: 1rem;
    width: 100%;
  }
  #popupOk.ready { display: block; }
</style>
</head>
<body>
<canvas id="view" aria-label="Orbit Pilot"></canvas>
<div id="hud" aria-label="Flight books">
  <div class="hud-row"><span>Mission money</span><b id="hudMission">¥0</b></div>
  <div class="hud-row"><span>Savings</span><b id="hudSavings">¥0</b></div>
  <div class="hud-row"><span>Debt</span><b id="hudDebt">¥0</b></div>
  <div class="hud-row"><span>Failed flights</span><b id="hudFails" class="ok">0</b></div>
  <div class="hud-row"><span>People dead</span><b id="hudCasualties" class="ok">0</b></div>
  <div class="hud-row"><span>Fuel left last time</span><b id="hudLastAcc">—</b></div>
  <div class="hud-row"><span>Average fuel left</span><b id="hudAvgAcc">—</b></div>
</div>
<div class="flight-btns">
  <button type="button" class="mission-btn" id="mission" hidden>Mission</button>
  <button type="button" class="mission-btn" id="restart" hidden>Restart</button>
</div>
<div id="coach" hidden>
  <p id="coachText"></p>
  <div id="coachNav">
    <button type="button" id="coachBack">Back</button>
    <span id="coachCount">1 / 1</span>
    <button type="button" id="coachNext">Next</button>
  </div>
  <button type="button" id="coachHide">Hide</button>
</div>
<button type="button" id="coachShow" hidden>Show steps</button>
<div id="control"><span class="emoji">😐</span>Brief in a moment.</div>
<div id="introPopup">
  <div class="popup-box">
    <div id="popupText"></div>
    <button type="button" class="primary" id="popupOk">I am ready</button>
  </div>
</div>
<div class="touch" id="touch">
  <button type="button" id="turn-left" tabindex="-1" aria-label="Rotate left">LEFT</button>
  <button type="button" id="burn" tabindex="-1" aria-label="Fire the engine">GO</button>
  <button type="button" id="turn-right" tabindex="-1" aria-label="Rotate right">RIGHT</button>
</div>
<div class="overlay" id="overlay"></div>
<p id="live" class="sr" aria-live="polite"></p>

  function spend(amount) {

    books.missionBudget -= fromBudget;
    left -= fromBudget;
    const fromSavings = Math.min(books.savings, left);
    books.savings -= fromSavings;
    left -= fromSavings;
    books.debt += left;
    refreshHud();
  }

  function bankLeftover() {
    if (books.missionBudget <= 0) return;
    if (books.debt > 0) {
      const pay = Math.min(books.debt, books.missionBudget);
      books.debt -= pay;
      books.missionBudget -= pay;
    }
    books.savings += books.missionBudget;
    books.missionBudget = 0;

  function playTalkBlip() {
    const ctx = getAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const filt = ctx.createBiquadFilter();
    const g = ctx.createGain();
    osc.type = "square";
    const f = talkNotes[(Math.random() * talkNotes.length) | 0] * (0.97 + Math.random() * 0.06);
    osc.frequency.setValueAtTime(f, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(200, f * 0.78), ctx.currentTime + 0.032);
    filt.type = "bandpass";
    filt.frequency.setValueAtTime(1100, ctx.currentTime);
    filt.Q.setValueAtTime(1.4, ctx.currentTime);
    g.gain.setValueAtTime(0.055, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.034);
    osc.connect(filt);
    filt.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.04);
  }

  function isTyping() {
    return !!typeJob.render && typeJob.i < typeJob.text.length;

  function finishType() {
    if (!typeJob.render) return false;
    if (typeJob.i >= typeJob.text.length) return false;
    clearTimeout(typeJob.timer);
    typeJob.i = typeJob.text.length;
    typeJob.render(typeJob.text, false);
    typeJob.render = null;
    typeJob.onDone = null;
    typeJob.id += 1;
    if (introOpen()) setPopupReady(true);
    return true;
  }

  function startType(text, render, onDone) {
    clearTimeout(typeJob.timer);
    typeJob.id += 1;
    const id = typeJob.id;
    typeJob.text = text;
    typeJob.render = render;
    typeJob.onDone = onDone || null;
    typeJob.i = 0;
    if (reduceMotion) {
      typeJob.i = text.length;
      render(text, false);
      typeJob.render = null;
      const done = typeJob.onDone;
      typeJob.onDone = null;
      if (done) done();
      return;
    }
    render("", true);
    function tick() {
      if (id !== typeJob.id) return;
      typeJob.i += 1;
      const shown = typeJob.text.slice(0, typeJob.i);
      const ch = typeJob.text[typeJob.i - 1];
      if (ch && /[A-Za-z0-9]/.test(ch)) playTalkBlip();
      const more = typeJob.i < typeJob.text.length;
      render(shown, more);
      if (more) typeJob.timer = setTimeout(tick, TYPE_MS);
      else {
        typeJob.render = null;
        const done = typeJob.onDone;
        typeJob.onDone = null;
        if (done) done();
      }
    }
    typeJob.timer = setTimeout(tick, TYPE_MS);
  }

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function makeStars() {
    const rand = rng(42);
    G.stars = [];
    for (let i = 0; i < 220; i++) {
      G.stars.push({
        x: rand() * 2800 - 1400,
        y: rand() * 1800 - 900,
        r: rand() < 0.08 ? 1.8 : 0.7 + rand() * 0.6,
        a: 0.25 + rand() * 0.7,
        ph: rand() * Math.PI * 2
      });
    }
  }

  function angDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function bodyById(id) {
    return G.bodies.find(function (b) { return b.id === id; });
  }

  function spawn(level) {
    const home = level.bodies.find(function (b) { return b.id === level.route[0]; });
    const R = home.orbit;
    const v = Math.sqrt(home.mu / R);
    return {
      x: home.x + R,
      y: home.y,
      vx: 0,
      vy: v,
      angle: Math.PI / 2,
      fuel: level.fuel
    };
  }

  function pullScale(b, dist) {
    const inner = b.capture * 0.95;
    const outer = b.capture * 1.55;
    if (dist <= inner) return 1;
    if (dist >= outer) return 0;
    const t = (dist - inner) / (outer - inner);
    const s = t * t * (3 - 2 * t);
    return 1 - s;
  }

  function accel(x, y, angle, thrusting) {
    let ax = 0;
    let ay = 0;
    for (let i = 0; i < G.bodies.length; i++) {
      const b = G.bodies[i];
      const dx = b.x - x;
      const dy = b.y - y;
      const d2 = dx * dx + dy * dy;
      const d = Math.sqrt(d2) || 1;
      const scale = pullScale(b, d);
      if (scale <= 0) continue;
      const inv = (b.mu * scale) / (d2 * d);
      ax += dx * inv;
      ay += dy * inv;
    }
    if (thrusting) {
      ax += Math.cos(angle) * THRUST;
      ay += Math.sin(angle) * THRUST;
    }
    return [ax, ay];
  }

  function verlet(s, dt, thrusting) {
    const a1 = accel(s.x, s.y, s.angle, thrusting);
    s.x += s.vx * dt + 0.5 * a1[0] * dt * dt;
    s.y += s.vy * dt + 0.5 * a1[1] * dt * dt;
    const a2 = accel(s.x, s.y, s.angle, thrusting);
    s.vx += 0.5 * (a1[0] + a2[0]) * dt;
    s.vy += 0.5 * (a1[1] + a2[1]) * dt;
  }

  function elements(ship, body) {
    const rx = ship.x - body.x;
    const ry = ship.y - body.y;
    const r = Math.hypot(rx, ry) || 1;
    const h = rx * ship.vy - ry * ship.vx;
    const ex = (ship.vy * h) / body.mu - rx / r;
    const ey = (-ship.vx * h) / body.mu - ry / r;
    const e = Math.hypot(ex, ey);
    const speed2 = ship.vx * ship.vx + ship.vy * ship.vy;
    const energy = speed2 / 2 - body.mu / r;
    const a = Math.abs(energy) > 1e-4 ? -body.mu / (2 * energy) : null;
    return { e: e, energy: energy, ex: ex, ey: ey, a: a, r: r, pull: body.mu / (r * r) };
  }

  function dominant() {
    let best = null;
    let pull = 0;
    for (let i = 0; i < G.bodies.length; i++) {
      const el = elements(G.ship, G.bodies[i]);
      const felt = el.pull * pullScale(G.bodies[i], el.r);
      if (felt > pull) {
        pull = felt;
        best = { body: G.bodies[i], el: el, felt: felt };
      }
    }
    return best;
  }

  function killMessage(b) {
    if (b.kind === "hole") return "You crossed " + b.name + "'s dark edge. No way back.";
    if (b.kind === "star") return "You flew into the red circle.";

  }

  function die(reason) {

  function win(gained) {

  function succeedNow() {

  function grab(body) {

  function controlsOn() {
    return G.mode === "play" && overlay.hidden && !introOpen();
  }

  function routePoints(level) {
    const pts = [];
    if (level.goal === "escape" && level.gate) {
      pts.push({ x: level.gate.fromX, y: level.gate.fromY });
      pts.push({ x: level.gate.x, y: level.gate.y });
      return pts;
    }
    const ids = level.route || [];
    for (let i = 0; i < ids.length; i++) {
      for (let j = 0; j < level.bodies.length; j++) {
        if (level.bodies[j].id === ids[i]) {
          pts.push({ x: level.bodies[j].x, y: level.bodies[j].y });
          break;
        }
      }
    }
    return pts;
  }

  function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / len2;
    if (t < 0) t = 0;
    else if (t > 1) t = 1;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function farOffPath(level, x, y) {
    const pts = routePoints(level);
    if (pts.length < 2) return false;
    let near = false;
    for (let i = 0; i < level.bodies.length; i++) {
      const b = level.bodies[i];
      if (Math.hypot(x - b.x, y - b.y) < b.capture * 1.8) near = true;
    }
    if (near) return false;
    let best = Infinity;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = distToSegment(x, y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
      if (d < best) best = d;
    }
    return best > 900;
  }

  function physics(dt) {
    if (!controlsOn()) return;
    const ship = G.ship;
    if (keys.ArrowLeft || keys.KeyA) ship.angle -= ROT * dt;
    if (keys.ArrowRight || keys.KeyD) ship.angle += ROT * dt;

    const thrusting = !!keys.Space && ship.fuel > 0;
    if (thrusting) {
      ship.fuel = Math.max(0, ship.fuel - FUEL_RATE * dt);
      if (Math.random() < 0.7) {
        const c = Math.cos(ship.angle);
        const s = Math.sin(ship.angle);
        G.particles.push({
          x: ship.x - c * 8,
          y: ship.y - s * 8,
          vx: ship.vx - c * 36 + (Math.random() - 0.5) * 10,
          vy: ship.vy - s * 36 + (Math.random() - 0.5) * 10,
          life: 0.28,
          max: 0.28
        });
      }
    }

    verlet(ship, dt, thrusting);

    if (G.trail.length === 0 || Math.hypot(ship.x - G.trail[G.trail.length - 1].x, ship.y - G.trail[G.trail.length - 1].y) > 4) {
      G.trail.push({ x: ship.x, y: ship.y });
      if (G.trail.length > 240) G.trail.shift();
    }

    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.life <= 0) G.particles.splice(i, 1);
    }

    const level = LEVELS[G.levelIndex];
    const goal = level.goal || "orbit";
    for (let i = 0; i < G.bodies.length; i++) {
      const b = G.bodies[i];
      if (Math.hypot(ship.x - b.x, ship.y - b.y) < b.kill) {
        if (goal === "dive" && b.id === level.target) {
          succeedNow();
          return;
        }
        die(killMessage(b));
        return;
      }
    }
    if (goal === "escape" && level.gate) {
      const gate = level.gate;
      if (Math.hypot(ship.x - gate.x, ship.y - gate.y) < gate.r) {
        succeedNow();
        return;
      }
    }
    if (farOffPath(level, ship.x, ship.y)) {
      die("You're way off the path. Mission failed.");
      return;
    }

    if (goal !== "orbit") return;
    const next = bodyById(G.route[G.progress]);
    if (!next) return;
    const ddx = ship.x - next.x;
    const ddy = ship.y - next.y;
    const dist = Math.hypot(ddx, ddy);
    const speed = Math.hypot(ship.vx, ship.vy);
    const vEsc = Math.sqrt((2 * next.mu) / Math.max(dist, 1));
    const bound = dist > next.kill * 1.08 && dist < next.capture && speed < vEsc * 0.98;
    if (bound) {
      const ang = Math.atan2(ddy, ddx);
      if (G.prevAng == null) G.sweepBase = ang;
      if (G.prevAng != null) {
        let d = ang - G.prevAng;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        G.meter += Math.abs(d);
        if (d !== 0) G.sweepSign = d > 0 ? 1 : -1;
      }
      G.prevAng = ang;
      if (G.meter > SWEEP) grab(next);
    } else {
      G.meter = Math.max(0, G.meter - dt * 0.55);
      G.prevAng = null;
    }
  }

  function predict() {
    const s = {
      x: G.ship.x,
      y: G.ship.y,
      vx: G.ship.vx,
      vy: G.ship.vy,
      angle: G.ship.angle,
      fuel: G.ship.fuel
    };
    const pts = [];
    let hit = -1;
    const burnSteps = controlsOn() && keys.Space && s.fuel > 0 ? 18 : 0;
    for (let i = 0; i < 420; i++) {
      verlet(s, STEP, i < burnSteps);
      if (i % 4 === 0) pts.push({ x: s.x, y: s.y });
      if (hit < 0) {
        for (let b = 0; b < G.bodies.length; b++) {
          const body = G.bodies[b];
          if (Math.hypot(s.x - body.x, s.y - body.y) < body.kill) {
            hit = pts.length - 1;
            break;
          }
        }
      }
      if (hit >= 0 && pts.length > hit + 8) break;
    }
    return { pts: pts, hit: hit };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(viewW * dpr));
    canvas.height = Math.max(1, Math.floor(viewH * dpr));
  }

  function cameraTarget() {
    let minX = G.ship.x;
    let maxX = G.ship.x;
    let minY = G.ship.y;
    let maxY = G.ship.y;
    const gate = LEVELS[G.levelIndex] && LEVELS[G.levelIndex].gate;
    if (gate) {
      minX = Math.min(minX, gate.x - gate.r - 40);
      maxX = Math.max(maxX, gate.x + gate.r + 40);
      minY = Math.min(minY, gate.y - gate.r - 40);
      maxY = Math.max(maxY, gate.y + gate.r + 40);
    }
    for (let i = 0; i < G.bodies.length; i++) {
      const b = G.bodies[i];
      minX = Math.min(minX, b.x - b.capture - 30);
      maxX = Math.max(maxX, b.x + b.capture + 30);
      minY = Math.min(minY, b.y - b.capture - 30);
      maxY = Math.max(maxY, b.y + b.capture + 30);
    }
    minX = Math.min(minX, G.ship.x - 40);
    maxX = Math.max(maxX, G.ship.x + 40);
    minY = Math.min(minY, G.ship.y - 40);
    maxY = Math.max(maxY, G.ship.y + 40);
    const spanX = Math.max(200, maxX - minX);
    const spanY = Math.max(200, maxY - minY);
    const margin = coarse.matches ? 150 : 120;
    const s = Math.min((viewW - 40) / spanX, (viewH - margin) / spanY);
    return { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s: s };
  }

  function snapCamera(instant) {
    const t = cameraTarget();
    if (instant) {
      G.cam.x = t.x;
      G.cam.y = t.y;
      G.cam.s = t.s;
      return;
    }
  }

  function updateCamera(dt) {
    const t = cameraTarget();
    const k = 1 - Math.pow(0.0008, dt);
    G.cam.x += (t.x - G.cam.x) * k;
    G.cam.y += (t.y - G.cam.y) * k;
    G.cam.s += (t.s - G.cam.s) * k;
    if (G.cam.shake > 0) G.cam.shake = Math.max(0, G.cam.shake - dt * 28);
  }

  function worldToScreen(x, y) {
    const shake = G.cam.shake ? Math.sin(G.time * 48) * G.cam.shake : 0;
    return [
      viewW / 2 + (x - G.cam.x) * G.cam.s + shake,
      viewH / 2 + (y - G.cam.y) * G.cam.s
    ];
  }

  function eWord(el) {
    if (!el || el.pull < 4) return "not held";
    if (el.energy >= 0 || el.e >= 1) return "flying away";
    if (el.e < 0.06) return "circle";
    if (el.e < 0.35) return "a little oval";
    if (el.e < 0.75) return "oval";
    return "very oval";
  }

  function drawSky() {
    const sky = LEVELS[G.levelIndex].sky;
    const g = ctx.createRadialGradient(viewW * 0.5, viewH * 0.45, 40, viewW * 0.5, viewH * 0.5, Math.max(viewW, viewH) * 0.72);
    g.addColorStop(0, sky);
    g.addColorStop(1, "#05060a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);
  }

  function drawStars() {
    for (let i = 0; i < G.stars.length; i++) {
      const star = G.stars[i];
      const p = worldToScreen(star.x, star.y);
      if (p[0] < -10 || p[1] < -10 || p[0] > viewW + 10 || p[1] > viewH + 10) continue;
      const tw = reduceMotion ? star.a : star.a * (0.65 + 0.35 * Math.sin(G.time * 1.4 + star.ph));
      ctx.fillStyle = "rgba(232, 238, 246, " + tw.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(p[0], p[1], star.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRing(body) {
    const idx = G.route.indexOf(body.id);
    const next = idx === G.progress;
    const done = idx > -1 && idx < G.progress;
    const p = worldToScreen(body.x, body.y);
    const rad = body.capture * G.cam.s;
    ctx.beginPath();
    ctx.arc(p[0], p[1], rad, 0, Math.PI * 2);
    ctx.strokeStyle = next ? "rgba(230, 194, 122, 0.95)" : done ? "rgba(126, 196, 154, 0.55)" : "rgba(180, 196, 214, 0.28)";
    ctx.lineWidth = next ? 2.25 : 1.25;
    ctx.setLineDash(next ? [7, 8] : [4, 10]);
    ctx.lineDashOffset = reduceMotion ? 0 : -G.time * (next ? 28 : 10);
    ctx.stroke();
    ctx.setLineDash([]);
    if (next && G.meter > 0.05) {
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 236, 196, 0.95)";
      ctx.lineWidth = 4;
      const a0 = G.sweepBase;
      const a1 = G.sweepBase + G.sweepSign * Math.min(G.meter, SWEEP);
      ctx.arc(p[0], p[1], rad - 7, a0, a1, G.sweepSign < 0);
      ctx.stroke();
    }
    if (body.kind === "star" || body.kind === "hole") {
      ctx.beginPath();
      ctx.arc(p[0], p[1], body.kill * G.cam.s, 0, Math.PI * 2);
      ctx.strokeStyle = body.kind === "star" ? "rgba(255, 90, 70, 0.85)" : "rgba(255, 150, 90, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawEllipse(dom) {
    const el = dom.el;
    if (!el.a || el.energy >= 0 || el.e >= 0.96 || el.a > 2200 || el.a < 8) return;
    const b = el.a * Math.sqrt(Math.max(0, 1 - el.e * el.e));
    const phi = Math.atan2(el.ey, el.ex);
    const c = el.a * el.e;
    const cx = dom.body.x - Math.cos(phi) * c;
    const cy = dom.body.y - Math.sin(phi) * c;
    const center = worldToScreen(cx, cy);
    ctx.save();
    ctx.translate(center[0], center[1]);
    ctx.rotate(phi);
    ctx.beginPath();
    ctx.ellipse(0, 0, el.a * G.cam.s, Math.max(1, b * G.cam.s), 0, 0, Math.PI * 2);
    ctx.strokeStyle = el.e < 0.2 ? "rgba(140, 214, 255, 0.45)" : "rgba(255, 196, 130, 0.5)";
    ctx.lineWidth = 1.25;
    ctx.stroke();
    ctx.restore();
  }

  function drawPrediction() {
    if (G.mode !== "play") return;
    const pred = predict();
    if (pred.pts.length < 2) return;
    function strokeRange(i0, i1, color) {
      ctx.beginPath();
      for (let i = i0; i <= i1 && i < pred.pts.length; i++) {
        const p = worldToScreen(pred.pts[i].x, pred.pts[i].y);
        if (i === i0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.4;
      ctx.setLineDash([2, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (pred.hit >= 0) {
      strokeRange(0, pred.hit, "rgba(186, 214, 255, 0.75)");
      strokeRange(pred.hit, pred.pts.length - 1, "rgba(255, 96, 82, 0.9)");
    } else {
      strokeRange(0, pred.pts.length - 1, "rgba(186, 214, 255, 0.8)");
    }
  }

  function drawTrail() {
    const n = G.trail.length;
    if (n < 2) return;
    for (let i = 1; i < n; i++) {
      const a = worldToScreen(G.trail[i - 1].x, G.trail[i - 1].y);
      const b = worldToScreen(G.trail[i].x, G.trail[i].y);
      ctx.strokeStyle = "rgba(150, 196, 230, " + (0.05 + 0.4 * (i / n)).toFixed(3) + ")";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (let i = 0; i < G.particles.length; i++) {
      const p = G.particles[i];
      const s = worldToScreen(p.x, p.y);
      ctx.fillStyle = "rgba(255, 186, 110, " + (p.life / p.max).toFixed(3) + ")";
      ctx.fillRect(s[0], s[1], 2.2, 2.2);
    }
  }

  function disk(x, y, r, c0, c1) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
    g.addColorStop(0, c0);
    g.addColorStop(1, c1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBody(body) {
    const p = worldToScreen(body.x, body.y);
    const rad = Math.max(2, body.r * G.cam.s);
    if (body.kind === "star") {
      const glow = ctx.createRadialGradient(p[0], p[1], rad * 0.2, p[0], p[1], body.kill * G.cam.s * 1.15);
      glow.addColorStop(0, "rgba(255, 244, 210, 0.95)");
      glow.addColorStop(0.35, "rgba(255, 186, 70, 0.55)");
      glow.addColorStop(1, "rgba(255, 80, 40, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p[0], p[1], body.kill * G.cam.s * 1.15, 0, Math.PI * 2);
      ctx.fill();
      disk(p[0], p[1], rad, "#fff6d2", "#ffb03a");
      return;
    }
    if (body.kind === "hole") {
      const halo = body.kill * G.cam.s;
      for (let i = 0; i < 14; i++) {
        const a = (reduceMotion ? 0.4 : G.time * 0.7) + i * 0.55;
        ctx.strokeStyle = "hsla(" + (24 + (i % 5) * 12) + ", 95%, " + (58 + (i % 3) * 10) + "%, 0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p[0], p[1], halo * 1.18, a, a + 0.42);
        ctx.stroke();
      }
      ctx.fillStyle = "#020203";
      ctx.beginPath();
      ctx.arc(p[0], p[1], halo * 0.92, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 220, 180, 0.8)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p[0], p[1], halo, 0, Math.PI * 2);
      ctx.stroke();
      return;
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(p[0], p[1], rad, 0, Math.PI * 2);
    ctx.clip();
    if (body.kind === "earth") {
      disk(p[0], p[1], rad, "#7eb6e8", "#1c4f86");
      ctx.fillStyle = "#3e8f52";
      ctx.beginPath();
      ctx.ellipse(p[0] - rad * 0.15, p[1] - rad * 0.05, rad * 0.42, rad * 0.28, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(p[0] + rad * 0.28, p[1] + rad * 0.22, rad * 0.22, rad * 0.16, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.ellipse(p[0] - rad * 0.05, p[1] - rad * 0.42, rad * 0.28, rad * 0.12, 0.2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      disk(p[0], p[1], rad, body.colors[1], body.colors[2]);
      const rand = rng(body.name.length * 97 + body.r);
      ctx.fillStyle = body.colors[0];
      for (let i = 0; i < 5; i++) {
        const a = rand() * Math.PI * 2;
        const d = rand() * rad * 0.55;
        ctx.beginPath();
        ctx.arc(p[0] + Math.cos(a) * d, p[1] + Math.sin(a) * d, rad * (0.08 + rand() * 0.12), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(p[0], p[1], rad + 3, 0, Math.PI * 2);
    ctx.strokeStyle = body.kind === "earth" ? "rgba(150, 200, 255, 0.45)" : "rgba(255,255,255,0.12)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawShip() {
    const ship = G.ship;
    const p = worldToScreen(ship.x, ship.y);
    const speed = Math.hypot(ship.vx, ship.vy);
    const velAng = Math.atan2(ship.vy, ship.vx);
    const align = Math.abs(angDiff(ship.angle, velAng));
    let aimColor = "rgba(255,255,255,0.9)";
    if (align < 0.22) aimColor = "#9ee7ff";
    else if (align > Math.PI - 0.28) aimColor = "#ffb089";

    const vlen = Math.max(18, Math.min(78, speed * G.cam.s * 0.9));
    ctx.strokeStyle = "rgba(140, 196, 255, 0.85)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.lineTo(p[0] + Math.cos(velAng) * vlen, p[1] + Math.sin(velAng) * vlen);
    ctx.stroke();

    ctx.strokeStyle = aimColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.lineTo(p[0] + Math.cos(ship.angle) * 34, p[1] + Math.sin(ship.angle) * 34);
    ctx.stroke();

    ctx.save();
    ctx.translate(p[0], p[1]);
    ctx.rotate(ship.angle);
    if (controlsOn() && keys.Space && ship.fuel > 0) {
      ctx.fillStyle = "rgba(255, 170, 80, 0.95)";
      ctx.beginPath();
      ctx.moveTo(-8, 0);
      ctx.lineTo(-18 - Math.random() * 8, 3.5);
      ctx.lineTo(-18 - Math.random() * 8, -3.5);
      ctx.fill();
    }
    ctx.fillStyle = "#f4f7fb";
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.lineTo(-11, 7);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-11, -7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#7fd0ff";
    ctx.fillRect(2, -2.2, 5, 4.4);
    ctx.restore();
  }

  function drawLabels() {
    ctx.font = "600 12px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    for (let i = 0; i < G.bodies.length; i++) {
      const b = G.bodies[i];
      const p = worldToScreen(b.x, b.y);
      const y = p[1] - Math.max(16, (b.kind === "hole" ? b.kill : b.r) * G.cam.s) - 10;
      const idx = G.route.indexOf(b.id);
      const next = idx === G.progress;
      ctx.fillStyle = next ? "#f0d7a4" : "rgba(232,238,246,0.8)";
      ctx.fillText(b.name, p[0], y);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHud(dom) {
    const level = LEVELS[G.levelIndex];
    const pad = 18;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.shadowColor = "rgba(0,0,0,0.65)";
    ctx.shadowBlur = 6;

    const narrow = viewW < 760;
    const titleY = narrow ? 50 : pad + 38;
    if (!narrow) {
      ctx.fillStyle = "#e6c27a";
      ctx.font = "700 11px Segoe UI, sans-serif";
      ctx.fillText("ORBIT PILOT  ·  " + (G.levelIndex + 1) + " / " + LEVELS.length, pad, pad + 12);
    }
    ctx.fillStyle = "#e8eef6";
    ctx.font = (narrow ? "600 18px " : "600 22px ") + "Segoe UI, sans-serif";
    ctx.fillText(level.title, pad, titleY);

    ctx.font = "600 13px Segoe UI, sans-serif";
    let rx = pad;
    let routeY = titleY + 24;
    const rightLimit = Math.max(pad + 110, viewW - (narrow ? Math.min(200, viewW * 0.48) : 16));
    for (let i = 0; i < G.route.length; i++) {
      const b = bodyById(G.route[i]);
      const done = i < G.progress;
      const next = i === G.progress && G.mode === "play";
      const label = (done ? "● " : "○ ") + (b ? b.name : "Exit");
      const labelW = ctx.measureText(label).width;
      if (rx > pad + 4 && rx + labelW > rightLimit) {
        rx = pad;
        routeY += 18;
      }
      ctx.fillStyle = done ? "#8fd0aa" : next ? "#f0d7a4" : "rgba(232,238,246,0.55)";
      ctx.fillText(label, rx, routeY);
      rx += labelW + 8;
      if (i < G.route.length - 1) {
        ctx.fillStyle = "rgba(232,238,246,0.4)";
        const arrow = "→";
        if (rx + 16 > rightLimit) {
          rx = pad;
          routeY += 18;
        }
        ctx.fillText(arrow, rx, routeY);
        rx += 22;
      }
    }

    const barW = Math.min(180, viewW * (narrow ? 0.42 : 0.22));
    const fy = routeY + 22;
    ctx.fillStyle = "#e8eef6";
    ctx.font = "700 11px Segoe UI, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("FUEL  " + Math.ceil(G.ship.fuel), pad, fy);
    roundRect(pad, fy + 8, barW, 8, 4);
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fill();
    const frac = G.ship.fuel / G.fuelMax;
    if (frac > 0) {
      roundRect(pad, fy + 8, Math.max(8, barW * frac), 8, 4);
      ctx.fillStyle = frac < 0.2 ? "#ff7a66" : frac < 0.45 ? "#e6c27a" : "#8fd0e8";
      ctx.fill();
    }
    const el = dom && dom.felt >= 4 ? dom.el : null;
    const foot = coarse.matches ? 210 : (narrow ? 150 : 110);
    const eY = viewH - foot;
    ctx.font = "600 13px Segoe UI, sans-serif";
    ctx.fillStyle = "#d5deea";
    if (el) {
      ctx.fillStyle = "#9ee7ff";
      ctx.font = "700 12px Segoe UI, sans-serif";
      ctx.fillText("PATH", pad, eY - 22);
      ctx.font = "600 20px Segoe UI, sans-serif";
      ctx.fillStyle = "#f4f7fb";
      ctx.fillText(el.e.toFixed(2), pad, eY);
      ctx.font = "600 13px Segoe UI, sans-serif";
      ctx.fillStyle = "#d5deea";
      const loose = !el || el.pull < 4;
      const leaving = el && (el.energy >= 0 || el.e >= 1);
      ctx.fillText(loose ? "Nothing's holding you" : leaving ? "Flying away from " + dom.body.name : eWord(el) + " around " + dom.body.name, pad + 58, eY);
    } else {
      ctx.fillText("Nothing's holding you", pad, eY);
    }

    if (G.toastT > 0) {
      ctx.textAlign = "center";
      ctx.font = "600 16px Segoe UI, sans-serif";
      ctx.fillStyle = "rgba(244, 247, 251, " + Math.min(1, G.toastT).toFixed(2) + ")";
      ctx.fillText(G.toast, viewW / 2, pad + 96);
    }
    ctx.shadowBlur = 0;
  }

  function drawGoal() {
    const gate = LEVELS[G.levelIndex] && LEVELS[G.levelIndex].gate;
    if (!gate) return;
    const end = worldToScreen(gate.x, gate.y);
    const start = worldToScreen(gate.fromX, gate.fromY);
    const rad = Math.max(12, gate.r * G.cam.s);
    ctx.save();
    ctx.strokeStyle = "rgba(158, 231, 255, 0.9)";
    ctx.fillStyle = "rgba(158, 231, 255, 0.08)";
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 7]);
    ctx.beginPath();
    ctx.moveTo(start[0], start[1]);
    ctx.lineTo(end[0], end[1]);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(end[0], end[1], rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#9ee7ff";
    ctx.font = "600 13px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Marked path", end[0], end[1] - rad - 10);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, viewW, viewH);
    drawSky();
    drawStars();
    const dom = dominant();
    for (let i = 0; i < G.bodies.length; i++) drawRing(G.bodies[i]);
    if (dom) drawEllipse(dom);
    drawPrediction();
    drawTrail();
    drawParticles();
    for (let i = 0; i < G.bodies.length; i++) drawBody(G.bodies[i]);
    drawGoal();
    drawLabels();
    drawShip();
    drawHud(dom);
  }

  let audioCtx = null;
  function getAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  window.addEventListener("pointerdown", function () { getAudio(); }, { once: true });
  window.addEventListener("keydown", function () { getAudio(); }, { once: true });

  function playTone(freq, dur, type, gain, freqEnd) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), ctx.currentTime + dur);
    g.gain.setValueAtTime(gain || 0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.02);
  }

  function playNoise(dur, gain, cutoff) {
    const ctx = getAudio();
    if (!ctx) return;
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(cutoff || 900, ctx.currentTime);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain || 0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(f);
    f.connect(g);
    g.connect(ctx.destination);
    src.start();
  }

  let engine = null;
  function engineStart() {
    if (engine) return;
    const ctx = getAudio();
    if (!ctx) return;
    const seconds = 2;
    const n = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 420;
    filter.Q.value = 0.6;
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.type = "sine";
    lfo.frequency.value = 14;
    lfoGain.gain.value = 180;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    const rumble = ctx.createOscillator();
    rumble.type = "sawtooth";
    rumble.frequency.value = 62;
    const rumbleGain = ctx.createGain();
    rumbleGain.gain.value = 0.04;
    const tremolo = ctx.createOscillator();
    const tremoloGain = ctx.createGain();
    tremolo.frequency.value = 9;
    tremoloGain.gain.value = 0.02;
    tremolo.connect(tremoloGain);
    tremoloGain.connect(rumbleGain.gain);
    const out = ctx.createGain();
    out.gain.value = 0.0001;
    noise.connect(filter);
    filter.connect(out);
    rumble.connect(rumbleGain);
    rumbleGain.connect(out);
    out.connect(ctx.destination);
    noise.start();
    lfo.start();
    rumble.start();
    tremolo.start();
    out.gain.linearRampToValueAtTime(0.16, ctx.currentTime + 0.06);
    engine = { noise: noise, lfo: lfo, rumble: rumble, tremolo: tremolo, out: out };
  }

  function engineStop() {
    if (!engine) return;
    const ctx = getAudio();
    const current = engine;
    engine = null;
    if (!ctx) return;
    try {
      current.out.gain.cancelScheduledValues(ctx.currentTime);
      current.out.gain.setValueAtTime(current.out.gain.value, ctx.currentTime);
      current.out.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
      const stopAt = ctx.currentTime + 0.1;
      current.noise.stop(stopAt);
      current.lfo.stop(stopAt);
      current.rumble.stop(stopAt);
      current.tremolo.stop(stopAt);
    } catch (err) { /* already stopped */ }
  }

  function sfx(kind) {
    if (kind === "success") {
      playTone(523.25, 0.12, "sine", 0.09);
      setTimeout(function () { playTone(783.99, 0.28, "sine", 0.08); }, 120);
    } else if (kind === "crash") {
      playNoise(0.55, 0.22, 500);
      playTone(90, 0.45, "square", 0.06, 40);
    } else if (kind === "escape") {
      playTone(480, 0.7, "sine", 0.07, 80);
      playNoise(0.3, 0.08, 1800);
    } else if (kind === "click") {
      playTone(880, 0.06, "square", 0.03);
    } else if (kind === "ok") {
      playTone(392, 0.08, "sine", 0.05);
      setTimeout(function () { playTone(523, 0.1, "sine", 0.04); }, 70);
    } else if (kind === "wrong") {
      playTone(196, 0.28, "square", 0.05);
    }
  }

  function card(html) {
    overlay.hidden = false;
    showFlightButtons(false);
    overlay.innerHTML = '<div class="card">' + html + "</div>";
    showCoachStep();
  }

  function closeOverlay() {
    overlay.hidden = true;
    G.intro = false;
    showFlightButtons(G.mode === "play" && !introOpen());
    showCoachStep();
  }

  function showCoachStep() {
    const level = LEVELS[G.levelIndex];
    const steps = level && level.steps ? level.steps : [];
    const flying = G.mode === "play" && overlay.hidden && !introOpen();
    const live = flying && coachEl.dataset.shut !== "1" && steps.length > 0;
    coachEl.hidden = !live;
    coachShow.hidden = !(flying && coachEl.dataset.shut === "1");
    if (!live) return;
    if (coachIndex >= steps.length) coachIndex = steps.length - 1;
    if (coachIndex < 0) coachIndex = 0;
    coachText.textContent = steps[coachIndex];
    coachCount.textContent = (coachIndex + 1) + " / " + steps.length;
    coachBack.disabled = coachIndex === 0;
    coachNext.textContent = coachIndex === steps.length - 1 ? "Done" : "Next";
  }

  function showBrief(level, resume) {
    overlay.hidden = true;
    G.openingBrief = !resume;
    setPopupReady(false);
    popupOk.textContent = "Understood";
    popupText.innerHTML =
      '<img class="brief-art" src="art/' + level.art + '" alt="' + escapeHtml(level.artAlt) + '">' +
      '<p class="brief-date">' + level.date + "</p>" +
      '<div class="brief-head"><span class="brief-face">' + level.face + '</span><h2 class="brief-name">' + level.title + "</h2></div>" +
      '<p class="route">' + level.bodies.map(function (b) { return b.name; }).join("  →  ") + "</p>" +
      '<p id="briefTalk" class="brief-body"></p>';
    introPopup.classList.add("show");
    showFlightButtons(false);
    showCoachStep();
    afterBrief = function () {
      const starting = G.openingBrief && !G.flightPaid && G.mode === "play";
      G.openingBrief = false;
      if (starting) {
        spend(level.cost);
        G.flightPaid = true;
        coachIndex = 0;
        coachEl.dataset.shut = "0";
        updateMoneyTalk();
      }
      showFlightButtons(G.mode === "play");
      showCoachStep();
    };
    typeInto(document.getElementById("briefTalk"), level.blurb, function () { setPopupReady(true); });
    say(level.title + ". " + level.blurb);
  }

  function endingPicture() {
    const lost = books.casualties > 0;
    const broke = books.debt > books.savings;
    const name = (lost ? "ending-loss-" : "ending-safe-") + (broke ? "debt" : "savings");
    const alt = lost
      ? (broke
        ? "A battered ship far from a dim Earth, with empty seats"
        : "A ship at Earth, with empty seats in the cabin")
      : (broke
        ? "A worn ship still safely orbiting a pale Earth"
        : "A clean ship in a calm orbit around a bright Earth");
    return '<img class="ending-art" src="art/' + name + '.jpg" alt="' + alt + '">';
  }

  function showEnd(success) {
    const level = LEVELS[G.levelIndex];
    const last = G.levelIndex === LEVELS.length - 1;
    const goal = level.goal || "orbit";
    if (success && last) {
      card(
        '<p class="kicker">EARTH</p><h2>You\'re at Earth.</h2>' +
        endingPicture() +
        "<p>All seven done. You're orbiting Earth. " + careerLine() + "</p>" +
        '<div class="actions"><button type="button" class="primary" data-go="replay" tabindex="-1">Fly the first mission again</button></div>'
      );
    } else if (success && goal === "dive") {
      card(
        '<p class="kicker">' + level.title.toUpperCase() + "</p><h2>Data's back.</h2>" +
        "<p>The satellite went into the black hole and sent the research data back before reaching its event horizon. It is lost now.</p>" +
        '<div class="actions"><button type="button" class="primary" data-go="next" tabindex="-1">Next mission</button>' +
        '<button type="button" class="ghost" data-go="retry" tabindex="-1">Retry this mission</button></div>'
      );
    } else if (success && goal === "escape") {
      card(
        '<p class="kicker">' + level.title.toUpperCase() + "</p><h2>On the path.</h2>" +
        "<p>The satellite made it along the marked path.</p>" +
        '<div class="actions"><button type="button" class="primary" data-go="next" tabindex="-1">Next mission</button>' +
        '<button type="button" class="ghost" data-go="retry" tabindex="-1">Retry this mission</button></div>'
      );
    } else if (success) {
      card(
        '<p class="kicker">' + level.title.toUpperCase() + "</p><h2>Orbiting Earth.</h2>" +
        "<p>You're circling Earth. Fuel refills next mission, and the worlds are in new places.</p>" +
        '<div class="actions"><button type="button" class="primary" data-go="next" tabindex="-1">Next mission</button>' +
        '<button type="button" class="ghost" data-go="retry" tabindex="-1">Retry this mission</button></div>'
      );
    } else {
      card(
        '<p class="kicker">FLIGHT OVER</p><h2>' + level.title + "</h2>" +
        "<p>" + G.reason + "</p>" +
        '<div class="actions"><button type="button" class="primary" data-go="retry" tabindex="-1">Try this mission again</button></div>'
      );
    }
    const buttons = overlay.querySelectorAll("[data-go]");
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].onclick = onOverlay;
    }
  }

  function onOverlay(e) {
    const go = e.currentTarget.getAttribute("data-go");
    sfx(go === "retry" ? "click" : "ok");
    if (go === "next") loadLevel(G.levelIndex + 1, "brief");
    else if (go === "replay") loadLevel(0, "brief");
    else if (go === "retry") loadLevel(G.levelIndex, "retry");
    else if (go === "confirm-restart") abortFlight();
    else closeOverlay();
  }

  function loadLevel(index, how) {
    const level = LEVELS[index];
    G.levelIndex = index;
    G.bodies = level.bodies.map(function (b) { return Object.assign({}, b); });
    G.route = level.route.slice();
    G.fuelMax = level.fuel;
    G.progress = 1;
    G.ship = spawn(level);
    G.meter = 0;
    G.prevAng = null;
    G.sweepSign = 1;
    G.mode = "play";
    G.toast = "";
    G.toastT = 0;
    G.reason = "";
    G.trail = [];
    G.particles = [];
    G.cam.shake = 0;
    G.flightPaid = false;
    G.openingBrief = false;
    G.judged = false;
    G.intro = how === "brief";
    resize();
    snapCamera(true);
    if (how === "brief") {
      beginMap(level);
      coachIndex = 0;
      coachEl.dataset.shut = "0";
      showBrief(level, false);
    } else if (how === "retry") {
      const note = G.failNote;
      G.failNote = "";
      spend(level.cost);
      G.flightPaid = true;
      overlay.hidden = true;
      G.intro = false;
      introPopup.classList.remove("show");
      showFlightButtons(true);
      coachIndex = 0;
      coachEl.dataset.shut = "0";
      showCoachStep();
      updateMoneyTalk(note);
      say(level.title + " restarted.");
    } else {
      overlay.hidden = true;
      showFlightButtons(false);
    }
  }

  function abortFlight() {
    if (G.mode === "play" && G.flightPaid && !G.judged) {
      recordFail();
      G.failNote = hurtSentence();
    }
    loadLevel(G.levelIndex, "retry");
  }

  function askRestart() {
    if (G.mode !== "play" || !overlay.hidden || introOpen()) return;
    sfx("click");
    const level = LEVELS[G.levelIndex];
    const crew = level && level.crew > 0 ? hurtSentence() : "";
    card(
      '<p class="kicker">RESTART</p><h2>Restart this mission?</h2>' +
      "<p>This counts as a fail." + crew + "</p>" +
      '<div class="actions"><button type="button" class="primary" data-go="confirm-restart">Restart</button>' +
      '<button type="button" class="ghost" data-go="cancel">Keep flying</button></div>'
    );
    const buttons = overlay.querySelectorAll("[data-go]");
    for (let i = 0; i < buttons.length; i++) buttons[i].onclick = onOverlay;
  }

  function bindHold(el, code) {
    function down(e) {
      e.preventDefault();
      keys[code] = true;
      if (overlay && !overlay.hidden) return;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* already gone */ }
    }
    function up() { keys[code] = false; }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("lostpointercapture", up);
  }

  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Space") e.preventDefault();
    if (e.code === "Enter" && introOpen()) {
      e.preventDefault();
      popupOk.click();
    } else if (e.code === "Enter" && !overlay.hidden) {
      e.preventDefault();
      const btn = overlay.querySelector(".primary");
      if (btn) btn.click();
    }
    if (e.code === "KeyR" && !e.repeat) {
      e.preventDefault();
      if (introOpen() && G.openingBrief) {
        showBrief(LEVELS[G.levelIndex], false);
        return;
      }
      if (introOpen()) return;
      if (!overlay.hidden && G.openingBrief) {
        showBrief(LEVELS[G.levelIndex], false);
        return;
      }
      if (!overlay.hidden) {
        if (G.mode !== "play") loadLevel(G.levelIndex, "retry");
        return;
      }
      askRestart();
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () {
    for (const k in keys) delete keys[k];
  });
  window.addEventListener("resize", function () { resize(); });

  missionBtn.addEventListener("click", function () {
    if (G.mode !== "play" || !overlay.hidden || introOpen()) return;
    sfx("click");
    showBrief(LEVELS[G.levelIndex], true);
  });
  restartBtn.addEventListener("click", askRestart);

  popupText.addEventListener("click", function () { finishType(); });

  popupOk.addEventListener("click", function () {
    if (finishType()) return;
    if (!popupOk.classList.contains("ready")) return;
    sfx("ok");
    introPopup.classList.remove("show");
    setPopupReady(false);
    const follow = afterBrief;
    afterBrief = null;
    if (follow) follow();
  });

  coachBack.addEventListener("click", function () {
    sfx("click");
    if (coachIndex > 0) coachIndex -= 1;
    showCoachStep();
  });
  coachNext.addEventListener("click", function () {
    const steps = LEVELS[G.levelIndex].steps;
    if (coachIndex < steps.length - 1) {
      sfx("click");
      coachIndex += 1;
    } else {
      sfx("ok");
      coachEl.dataset.shut = "1";
    }
    showCoachStep();
  });
  document.getElementById("coachHide").addEventListener("click", function () {
    sfx("click");
    coachEl.dataset.shut = "1";
    showCoachStep();
  });
  coachShow.addEventListener("click", function () {
    sfx("click");
    coachEl.dataset.shut = "0";
    showCoachStep();
  });

  bindHold(document.getElementById("turn-left"), "ArrowLeft");
  bindHold(document.getElementById("turn-right"), "ArrowRight");
  bindHold(document.getElementById("burn"), "Space");

  let last = 0;
  let acc = 0;
  function frame(ts) {
    if (!last) last = ts;
    let dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    G.time += dt;
    if (G.toastT > 0) G.toastT -= dt;
    acc += dt;
    while (acc >= STEP) {
      physics(STEP);
      acc -= STEP;
    }
    updateCamera(dt);
    const thrusting = controlsOn() && G.ship && keys.Space && G.ship.fuel > 0;
    if (thrusting) engineStart();
    else engineStop();
    draw();
    requestAnimationFrame(frame);
  }

  makeStars();
  refreshHud();
  loadLevel(0, "silent");
  showGameIntro();
  requestAnimationFrame(frame);
})();
</script>
</body>
