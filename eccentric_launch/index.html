<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eccentric launch</title>
<style>
  :root { --ink:#172033; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#05070e; color:#f4efe6; font-family:"Segoe UI", sans-serif; }
  body > canvas { display:block; position:fixed; inset:0; z-index:0; }
  #vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.5) 100%); }
  #nextReady.hide, #detailBtn.hide, #tipBox.hide, #shade.hide, #report.hide, #ending.hide, #intro.hide, #relaunch.hide, #status.hide, #moodSay.hide { display:none; }
  #nextReady {
    position:fixed; z-index:6; right:16px; bottom:118px;
    padding:12px 22px; font-size:1.05rem; box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  #detailBtn {
    position:fixed; z-index:5; top:14px; right:16px;
    padding:6px 14px; border:1px solid #2a6a88; border-radius:999px;
    background:rgba(8,12,22,.92); color:#f4efe6; font:inherit; font-size:.85rem; cursor:pointer;
  }
  #tipBox {
    position:fixed; z-index:6; width:min(300px, 92vw); pointer-events:none;
    background:#fff; color:var(--ink); border-radius:14px; padding:10px 12px;
    box-shadow:0 8px 20px rgba(0,0,0,.28); font-size:.95rem; font-weight:600; line-height:1.35;
  }
  #tipBox b { display:block; margin-bottom:3px; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#8a4b2a; }
  #panel { position:fixed; z-index:4; top:14px; left:14px; width:min(340px, calc(100vw - 310px)); max-height:calc(100vh - 28px); overflow:auto; background:rgba(8,16,36,.92); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:14px 14px 12px; }
  .kicker { margin:0; letter-spacing:.12em; text-transform:uppercase; font-size:.72rem; color:#9fd4ef; font-weight:700; }
  h1 { margin:4px 0 6px; font-size:1.4rem; }
  .hint, .rule { margin:0 0 8px; font-size:.98rem; line-height:1.35; }
  .rule { color:#f0c14a; font-weight:700; }
  .slide { margin:8px 0; }
  .slide label { display:flex; justify-content:space-between; gap:8px; font-size:.98rem; font-weight:700; }
  input[type=range] { width:100%; margin-top:4px; accent-color:#f0c14a; }
  button { border:0; border-radius:999px; padding:10px 16px; font:700 1rem "Segoe UI", sans-serif; cursor:pointer; background:#fff; color:var(--ink); }
  button:disabled { opacity:.45; cursor:default; }
  #go, #relaunch { width:100%; margin-top:8px; }
  #relaunch { background:#ffb15a; }
  #hud { position:fixed; z-index:4; top:56px; right:16px; width:268px; background:rgba(8,16,36,.92); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:12px; }
  .row { display:flex; justify-content:space-between; gap:10px; margin:3px 0; font-size:.92rem; }
  .row span { color:#d5e4ef; }
  .row b { font-variant-numeric:tabular-nums; text-align:right; }
  .row b.ok { color:#86efac; }
  .row b.bad { color:#ff8b8b; }
  .fuel { height:8px; background:rgba(0,0,0,.4); border-radius:99px; margin:2px 0 8px; overflow:hidden; }
  .fuel i { display:block; height:100%; width:0; background:#7dcea0; }
  .fuel i.low { background:#ff8b8b; }
  #shapeLine, #status { margin:8px 0 0; font-size:.92rem; line-height:1.35; }
  #legend { color:#9fd4ef; font-size:.92rem; }
  #shade, #report, #ending, #intro { position:fixed; inset:0; z-index:8; background:rgba(5,8,16,.72); display:flex; align-items:center; justify-content:center; }
  #ending, #intro { z-index:9; }
  .popup { background:#071018; border:1px solid #2a6a88; border-radius:16px; padding:16px; width:min(480px, 92vw); max-height:min(88vh, 760px); overflow:auto; line-height:1.45; }
  .popup h2 { margin:0 0 8px; font-size:1.35rem; }
  .popup p { margin:0 0 8px; }
  .popup button { width:100%; margin-top:8px; }
  .popup.goal-pop { text-align:center; padding:22px 20px 18px; }
  .popup.goal-pop h2 { font-size:1.9rem; margin:2px 0 14px; }
  .goal-card { background:rgba(125,206,160,.14); border:1px solid rgba(125,206,160,.5); border-radius:14px; padding:12px 10px 10px; margin:0 0 10px; }
  .goal-card span { display:block; font-size:.76rem; letter-spacing:.08em; text-transform:uppercase; color:#9fd4ef; font-weight:700; }
  .goal-card b { display:block; font-size:1.75rem; line-height:1.15; color:#86efac; margin:3px 0; }
  .goal-card em { font-style:normal; color:#d5e4ef; font-size:.98rem; }
  button.next-mission { background:#f0c14a; font-size:1.28rem; padding:16px 18px; margin-top:14px; }
  .popup img.art { width:100%; height:168px; object-fit:cover; border-radius:12px; margin:0 0 10px; display:block; background:#102033; }
  .meter-top { display:flex; justify-content:space-between; gap:8px; font-size:.88rem; }
  .meter-top b { font-variant-numeric:tabular-nums; }
  .scale { position:relative; height:12px; background:rgba(0,0,0,.4); border-radius:99px; margin:4px 0 2px; }
  .scale i { display:block; height:100%; width:0; border-radius:99px; background:#ff8b8b; }
  .scale i.met { background:#7dcea0; }
  .scale i.high { background:#f0c14a; }
  .scale em { position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:#fff; }
  .ladder { display:flex; gap:4px; margin:2px 0 10px; }
  .ladder span { flex:1; text-align:center; font-size:.68rem; color:#8ea0b0; border-top:3px solid #243444; padding-top:3px; }
  .ladder span.on { color:#f4efe6; border-top-color:#f0c14a; font-weight:700; }
  #mood { position:fixed; z-index:5; right:16px; bottom:14px; display:flex; align-items:flex-end; gap:8px; pointer-events:none; }
  #moodSay { margin:0 0 18px; max-width:320px; background:#fff; color:var(--ink); border-radius:16px 16px 4px 16px; padding:10px 12px; font-size:1rem; font-weight:700; line-height:1.3; }
  #moodFace { font-size:84px; line-height:1; filter:drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
  #noseView {
    position:relative; height:148px; margin:2px 0 10px; border-radius:12px; overflow:hidden;
    background:radial-gradient(circle at 50% 58%, #163044, #070b14 74%);
    border:1px solid rgba(159,212,239,.4);
  }
  #noseView canvas { width:100%; height:100%; display:block; }
  #noseUpMark, #noseCap {
    position:absolute; left:8px; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; pointer-events:none;
  }
  #noseUpMark { top:6px; color:#9fd4ef; }
  #nosePathMark { position:absolute; right:8px; top:42%; color:#f0c14a; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; pointer-events:none; }
  #noseCap { bottom:6px; color:#f4efe6; letter-spacing:0; text-transform:none; font-size:.8rem; }
</style>
</head>
<body>
<div id="vignette"></div>
<button type="button" id="detailBtn">Burn 1</button>
<div id="panel">
  <p class="kicker" id="kicker">1 of 7</p>
  <h1 id="title">Calm the oval</h1>
  <div id="sliders"></div>
  <div id="noseView">
    <canvas id="noseCanvas"></canvas>
    <b id="noseUpMark">Up, away from the planet</b>
    <b id="nosePathMark">Path</b>
    <b id="noseCap">Nose along the path</b>
  </div>
  <p class="hint hide" id="status"></p>
  <button id="go" type="button">Burn</button>
  <button id="relaunch" type="button" class="hide">Launch a new one</button>
</div>
<button type="button" id="nextReady" class="hide">Finish</button>
<div id="hud">
  <div class="row"><span id="g1l">Target</span><b id="g1">—</b></div>
  <div class="row"><span id="g2l">Target</span><b id="g2">—</b></div>
  <div class="row"><span>Grant</span><b id="grant"></b></div>
  <div class="row"><span>Savings</span><b id="savings"></b></div>
  <div class="row"><span>Debt</span><b id="debt"></b></div>
  <div class="row"><span>This burn</span><b id="cost"></b></div>
  <div class="row"><span>Fuel</span><b id="fuelText"></b></div>
  <div class="fuel"><i id="fuelBar"></i></div>
  <div class="row"><span id="l1">Eccentricity</span><b id="v1"></b></div>
  <div class="row"><span id="l2">Lowest point</span><b id="v2"></b></div>
  <div class="row"><span id="l3">Highest point</span><b id="v3"></b></div>
</div>
<div id="mood">
  <p id="moodSay" class="hide"></p>
  <div id="moodFace">🙂</div>
</div>
<div id="tipBox" class="hide"><b id="tipLabel">Tip</b><span id="tipText"></span></div>
<div id="intro" class="hide">
  <div class="popup">
    <p class="kicker">Chinese space agency</p>
    <h2>Your post</h2>
    <div id="introParas"></div>
    <button type="button" id="introOk">Begin</button>
  </div>
</div>
<div id="shade" class="hide">
  <div class="popup">
    <p class="kicker" id="briefKicker">Burn</p>
    <h2 id="briefTitle"></h2>
    <img id="briefArt" class="art" alt="">
    <div id="briefParas"></div>
    <button type="button" id="briefOk">Ready</button>
  </div>
</div>
<div id="report" class="hide"></div>
<div id="ending" class="hide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const R = 6371, GM = 398600, AIR = 160, BODY = 2.2, MOON_R = 0.46;
const GJ = 1.2668654e8, RJ = 71492;
const NOSE_TIP = "Drag this and watch the yellow ring. Plus points the nose up, and the other side of the ring drops. Minus points the nose down, and that side lifts.";
const PUSH_TIP = "Plus speeds the craft up. Minus slows it down. The gold ring is the orbit after this burn. Click Burn and that ring becomes the real orbit. Then you can aim another burn.";

function circleV(h, gm, bodyR) { return Math.sqrt((gm || GM) / ((bodyR || R) + h)); }
function visR(rKm, bodyR) {
  const h = rKm - bodyR;
  if (h <= 0) return Math.max(0.08, BODY * (Math.max(0, rKm) / Math.max(1, bodyR)));
  return BODY + Math.min(16, Math.pow(h, 0.5) * 0.05);
}
function burnoutNu(a, e, r, deg) {
  if (e < 1e-3) return 0;
  let c = (a * (1 - e * e) / r - 1) / e;
  c = clamp(c, -1, 1);
  let nu = Math.acos(c);
  if (Math.abs(deg) < 0.05) {
    const rp = a * (1 - e);
    return Math.abs(r - rp) < Math.abs(r - a * (1 + e)) ? 0 : Math.PI;
  }
  return deg < 0 ? -nu : nu;
}
function fly(h, v, deg, gm, bodyR, airAlt) {
  gm = gm || GM; bodyR = bodyR == null ? R : bodyR; airAlt = airAlt == null ? AIR : airAlt;
  const r = bodyR + h;
  const g = deg * Math.PI / 180;
  const energy = v * v / 2 - gm / r;
  const ang = r * v * Math.cos(g);
  const vesc = Math.sqrt(2 * gm / r);
  const disc = 1 + 2 * energy * ang * ang / (gm * gm);
  let e = Math.sqrt(Math.max(0, disc));
  const out = { h: h, v: v, deg: deg, e: e, r: r, gm: gm, bodyR: bodyR, vesc: vesc, a: 0, nu0: 0, rawHp: h, rawHa: h, margin: Math.max(0, vesc - v), spare: v - vesc, roundScore: 0, stretch: 0, kind: "ok" };
  if (Math.abs(energy) < 1e-9) { out.kind = "leave"; out.e = 1; return out; }
  const a = -gm / (2 * energy);
  const leaving = energy >= -1e-8 || e >= 0.999;
  if (leaving) e = Math.max(1.0001, e);
  out.a = a; out.e = e;
  out.rawHp = a * (1 - e) - bodyR;
  out.rawHa = leaving ? Infinity : a * (1 + e) - bodyR;
  out.stretch = leaving ? Infinity : Math.max(0, out.rawHa - out.rawHp);
  out.roundScore = leaving ? 0 : 1000 / (1 + out.stretch / 140);
  if (e >= 1e-3 && isFinite(a)) out.nu0 = burnoutNu(a, e, r, deg);
  if (out.rawHp <= 0) out.kind = "ground";
  else if (!leaving && out.rawHp < airAlt) out.kind = "air";
  else if (leaving) out.kind = "leave";
  return out;
}
function kmText(n) {
  if (n == null || !isFinite(n)) return "no high point";
  return Math.round(n).toLocaleString() + " km";
}
function placeWords(km) {
  if (km == null || !isFinite(km)) return "no high point";
  if (km < 0) return "under the ground";
  if (km < AIR) return Math.round(km) + " km up, in thick air";
  return kmText(km) + " up";
}
function shapeWords(el) {
  if (!el) return "";
  if (el.kind === "moon") return "The path goes into the Moon, so the craft is destroyed.";
  if (el.kind === "ground") return "The path hits the ground, so the craft is destroyed.";
  if (el.kind === "leave") return "The path does not come back. The craft flies away.";
  if (el.kind === "air") return "The lowest point is under 160 km. The air there is thick enough to slow the craft, so it falls.";
  if (el.e < 0.04) return "The path is a circle. Eccentricity is about 0, so the oval is not stretched.";
  if (el.e >= 0.7) return "The path is a very long oval. Eccentricity is " + el.e.toFixed(2) + ".";
  return "The path is a stretched oval. Eccentricity is " + el.e.toFixed(2) + ".";
}

const MISSIONS = [
  {
    title: "Calm the oval", art: "art/mission-1.jpg", alt: "A satellite on a stretched path around Earth",
    need1: 700, need2: 360, lab1: "Lowest point", lab2: "How round", unit1: " km", unit2: "",
    fuel: 0.9, relaunch: 9, gm: GM, bodyR: R, air: AIR, planet: "earth",
    start: { h: 1200, v: 6.95, deg: 0 },
    labels: ["Eccentricity", "Lowest point", "Highest point"],
    brief: [
      "This weather satellite is already going around Earth. Its low point is only about 45 km up, so it dips into thick air.",
      "Speed up by about +0.3 km/s, with the nose along the path, so the low side rises into a circle. If the yellow ring hits the ground, do not burn."
    ],
    sliders: [
      { key: "p", label: "Engine push", min: -0.5, max: 0.7, step: 0.05, value: 0, unit: " km/s", tip: "About +0.3 km/s makes the gold ring a circle. Less leaves the low side in thick air. Much more stretches a new high point." },
      { key: "a", label: "Nose up", min: -40, max: 40, step: 1, value: 0, unit: "°", tip: NOSE_TIP }
    ],
    metrics(el) { return el.kind === "ok" ? [Math.max(0, el.rawHp), el.roundScore] : [0, 0]; },
    rows(el) { return [el.e.toFixed(2), placeWords(el.rawHp), placeWords(el.rawHa)]; }
  },
  {
    title: "Lower, stay round", art: "art/mission-2.jpg", alt: "A satellite dropping toward a lower path around Earth",
    need1: 700, need2: 600, lab1: "Lower", lab2: "Kept round", unit1: "", unit2: "",
    fuel: 0.8, relaunch: 9, gm: GM, bodyR: R, air: AIR, planet: "earth",
    start: { h: 1800, v: 6.984, deg: 0 },
    labels: ["Eccentricity", "Lowest point", "Highest point"],
    brief: [
      "This satellite is on a circle about 1,800 km up. Bring the lowest point near 600 km, and keep the path fairly round.",
      "Slow down by about −0.25 km/s. Much more than that, and the low side hits the ground."
    ],
    sliders: [
      { key: "p", label: "Engine push", min: -0.7, max: 0.4, step: 0.05, value: 0, unit: " km/s", tip: PUSH_TIP + " Try about −0.25 km/s." },
      { key: "a", label: "Nose up", min: -40, max: 40, step: 1, value: 0, unit: "°", tip: NOSE_TIP }
    ],
    metrics(el) {
      if (el.kind !== "ok") return [0, 0];
      return [Math.max(0, 1100 - Math.abs(el.rawHp - 600)), Math.max(0, 1000 * (1 - el.e / 0.28))];
    },
    rows(el) { return [el.e.toFixed(2), placeWords(el.rawHp), placeWords(el.rawHa)]; }
  },
  {
    title: "Reach toward the Moon", art: "art/mission-3.jpg", alt: "A path stretched out toward the Moon",
    need1: 1500, need2: 300, lab1: "Meet the Moon", lab2: "Lowest point", unit1: "", unit2: " km",
    needText: "Lift the highest point to about 20,000 km, where the Moon can bend the path. Keep the lowest point above 300 km.",
    fuel: 2.8, relaunch: 12, gm: GM, bodyR: R, air: AIR, planet: "earth", moonAt: 20000,
    start: { h: 400, v: 7.673, deg: 0 },
    labels: ["Eccentricity", "Lowest point", "Highest point"],
    brief: [
      "This probe is on a low circle. The Moon is the grey ball. Raise the high point to meet it, and keep the low point above 300 km.",
      "Speed up by about +2 km/s, with the nose along the path. If the yellow ring goes into the Moon, the probe is destroyed."
    ],
    sliders: [
      { key: "p", label: "Engine push", min: -1, max: 2.6, step: 0.05, value: 0, unit: " km/s", tip: "About +2 km/s stretches the gold ring out to the Moon. You can do it in smaller burns. The gold ring replaces the white one each time you click Burn." },
      { key: "a", label: "Nose up", min: -40, max: 40, step: 1, value: 0, unit: "°", tip: NOSE_TIP }
    ],
    metrics(el) {
      if (el.kind !== "ok" || el.rawHp < 300) return [0, 0];
      return [Math.max(0, 3000 - Math.abs(el.rawHa - 20000) / 6), el.rawHp];
    },
    rows(el) { return [el.e.toFixed(2), placeWords(el.rawHp), placeWords(el.rawHa)]; }
  },
  {
    title: "Reach the ship", art: "art/mission-4.jpg", alt: "A satellite climbing toward a waiting ship above Earth",
    need1: 1500, need2: 220, lab1: "Meet", lab2: "Lowest point", unit1: "", unit2: " km",
    fuel: 1, relaunch: 9, gm: GM, bodyR: R, air: AIR, planet: "earth", shipAt: 1600,
    start: { h: 350, v: 7.701, deg: 0 },
    labels: ["Eccentricity", "Lowest point", "Highest point"],
    brief: [
      "This satellite is on a low circle, about 350 km up. A ship is moving on its own circle, 1,600 km up.",
      "Speed up by about +0.3 km/s so the yellow ring's high point reaches the ship's circle. The ship keeps moving while you aim."
    ],
    sliders: [
      { key: "p", label: "Engine push", min: -0.4, max: 0.8, step: 0.05, value: 0, unit: " km/s", tip: "About +0.3 km/s lifts the high point to the ship's circle at 1,600 km." },
      { key: "a", label: "Nose up", min: -40, max: 40, step: 1, value: 0, unit: "°", tip: NOSE_TIP }
    ],
    metrics(el) {
      if (el.kind === "leave" || el.kind === "ground") return [0, 0];
      return [Math.max(0, 2200 - Math.abs(el.rawHa - 1600)), Math.max(0, el.rawHp)];
    },
    rows(el) { return [el.e.toFixed(2), placeWords(el.rawHp), placeWords(el.rawHa)]; }
  },
  {
    title: "Swing past Jupiter", art: "art/mission-5.jpg", alt: "A probe swinging past Jupiter",
    need1: 1000, need2: 1000, lab1: "Leave", lab2: "Safe pass", unit1: "", unit2: "",
    needText: "Leave Jupiter going at least 0.4 km/s faster than the speed that escapes, and do not hit the clouds.",
    fuel: 3.2, relaunch: 16, gm: GJ, bodyR: RJ, air: 0, planet: "jupiter", wantLeave: true,
    start: { h: 8000, v: 54.96, deg: 0 },
    labels: ["Spare speed", "Path", "Lowest point"],
    brief: [
      "You are at Jupiter, not quite fast enough to leave. A path that swings away can throw the probe out of the solar system.",
      "Speed up by a bit more than +2 km/s so the path does not come back. Do not drop the low side into the clouds."
    ],
    sliders: [
      { key: "p", label: "Engine push", min: -2, max: 3.2, step: 0.05, value: 0, unit: " km/s", tip: "About +2.2 km/s opens the gold path so it leaves Jupiter. Nose up will drive the low side into the planet." },
      { key: "a", label: "Nose up", min: -40, max: 40, step: 1, value: 0, unit: "°", tip: NOSE_TIP }
    ],
    metrics(el) {
      if (el.kind !== "leave" || el.rawHp <= 0 || el.spare < 0.4) return [0, 0];
      return [1000 + Math.min(1000, (el.spare - 0.4) * 400), 1000 + Math.min(1000, el.rawHp / 20)];
    },
    rows(el) {
      return [(el.spare >= 0 ? "+" : "") + el.spare.toFixed(2) + " km/s", el.kind === "leave" ? "flies away" : "comes back", placeWords(el.rawHp)];
    }
  },
  {
    title: "Point the nose down", art: "art/mission-6.jpg", alt: "A satellite with its nose tilted up above Earth",
    need1: 220, need2: 2500, lab1: "Lowest point", lab2: "Highest point", unit1: " km", unit2: " km",
    fuel: 0.8, relaunch: 9, gm: GM, bodyR: R, air: AIR, planet: "earth",
    start: { h: 450, v: 8.2, deg: 8 },
    labels: ["Eccentricity", "Lowest point", "Highest point"],
    brief: [
      "The nose is already 8° up, so the low side is in thick air, only about 20 km up.",
      "Move Nose up to about −8°. The low side should clear the air, and the high point should stay above 2,500 km."
    ],
    sliders: [
      { key: "p", label: "Engine push", min: -0.4, max: 0.6, step: 0.05, value: 0, unit: " km/s", tip: PUSH_TIP },
      { key: "a", label: "Nose up", min: -40, max: 40, step: 1, value: 0, unit: "°", tip: "The nose is already 8° up. Move this to about −8° and watch the low side of the yellow ring rise." }
    ],
    metrics(el) {
      if (el.kind === "leave" || el.kind === "ground" || el.kind === "air") return [0, 0];
      return [Math.max(0, el.rawHp), Math.max(0, el.rawHa)];
    },
    rows(el) { return [el.e.toFixed(2), placeWords(el.rawHp), placeWords(el.rawHa)]; }
  },
  {
    title: "Slow down and come back", art: "art/mission-7.jpg", alt: "A fast probe whose path can curve back around Earth",
    need1: 10000, need2: 0.45, lab1: "Highest point", lab2: "Spare speed", unit1: " km", unit2: " km/s",

  history.forEach((h) => { pts += h.tier === "A miracle" ? 3 : h.tier === "Excellent" ? 2 : 1; });
  const avg = history.length ? pts / history.length : 1;
  const byTier = avg >= 2.4 ? "outstanding" : avg >= 1.4 ? "strong" : "steady";
  const byScore = ratio >= 1.75 ? "outstanding" : ratio >= 1.22 ? "strong" : "steady";
  const rank = { steady: 0, strong: 1, outstanding: 2 };
  return rank[byTier] >= rank[byScore] ? byTier : byScore;
}
function recordLine() {
  let goal = 0, great = 0, miracle = 0;
  history.forEach((h) => { if (h.tier === "A miracle") miracle += 1; else if (h.tier === "Excellent") great += 1; else goal += 1; });
  const bits = [];
  if (goal) bits.push(goal + " at goal");
  if (great) bits.push(great + " excellent");
  if (miracle) bits.push(miracle + (miracle === 1 ? " miracle" : " miracles"));
  return "Record: " + bits.join(", ") + ".";
}
const ENDINGS = {
  steady: { clear: { title: "The books are clear", line: "Each path did the job that was asked. The grants covered the cost, and money is left in savings." }, debt: { title: "Money still owed", line: "Each path did the job that was asked. Some new launches cost more than the grants, so money is still owed." } },
  strong: { clear: { title: "A strong record", line: "Several paths did more than the job asked. The grants covered the cost, and money is left in savings." }, debt: { title: "A strong record", line: "Several paths did more than the job asked. The record is strong, and money is still owed." } },
  outstanding: { clear: { title: "An outstanding campaign", line: "The paths went well past what each job asked. The books are clear." }, debt: { title: "An outstanding campaign", line: "The paths went well past what each job asked. The record is outstanding, and money is still owed." } }
};
function showEnd() {
  document.getElementById("report").classList.add("hide");
  document.getElementById("shade").classList.add("hide");
  document.getElementById("intro").classList.add("hide");
  document.getElementById("detailBtn").classList.add("hide");
  document.getElementById("nextReady").classList.add("hide");
  document.getElementById("panel").style.display = "none";
  hideTip();
  const end = document.getElementById("ending");
  end.classList.remove("hide");
  const picked = ENDINGS[campaignStanding()][debt > 0 ? "debt" : "clear"];
  const books = debt > 0 ? "Money still owed: " + formatMoney(debt) + "." : "Savings left: " + formatMoney(savings) + ".";
  const lines = history.map((h, i) => (i + 1) + ". " + h.title + " — " + h.tier).join("<br>");
  end.innerHTML = "<div class='popup'><h2>" + picked.title + "</h2><p>" + picked.line + "</p><p>Combined score " + totalScore.toLocaleString() + ". " + recordLine() + " " + books + "</p><p>" + lines + "</p></div>";
}
document.getElementById("go").addEventListener("click", () => { ensureAudio(); applyBurn(); });
document.getElementById("relaunch").addEventListener("click", () => { ensureAudio(); doRelaunch(); });
document.getElementById("nextReady").addEventListener("click", () => { ensureAudio(); clickSfx(); if (scored(committed()).ready) showResult(); });
document.getElementById("detailBtn").addEventListener("click", () => {
  if (successAt) return;
  ensureAudio(); clickSfx(); if (introDone) openBrief();
});
document.getElementById("briefOk").addEventListener("click", () => { ensureAudio(); clickSfx(); document.getElementById("shade").classList.add("hide"); typeState = null; });
document.getElementById("introOk").addEventListener("click", () => { ensureAudio(); clickSfx(); introDone = true; document.getElementById("intro").classList.add("hide"); typeState = null; openBrief(); });
document.getElementById("panel").addEventListener("scroll", hideTip);
window.addEventListener("resize", () => {
  if (!renderer) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
let audioCtx = null, typeState = null;
function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function clickSfx() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = "square"; osc.frequency.setValueAtTime(660, t);
  gain.gain.setValueAtTime(0.03, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  osc.connect(gain).connect(ctx.destination); osc.start(t); osc.stop(t + 0.06);
}
function typeTick(ch) {
  if (!audioCtx || audioCtx.state !== "running" || !ch || !/[A-Za-z0-9]/.test(ch)) return;
  const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = "square"; osc.frequency.setValueAtTime(720 + Math.random() * 180, t);
  gain.gain.setValueAtTime(0.02, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  osc.connect(gain).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.04);
}
let noiseBuf = null;
function noiseBuffer(ctx) {
  if (noiseBuf && noiseBuf.sampleRate === ctx.sampleRate) return noiseBuf;
  const len = Math.floor(ctx.sampleRate * 2);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  noiseBuf = buf;
  return buf;
}
function launchSfx() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t = ctx.currentTime;
  const dur = 1.15;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx);
  src.loop = true;
  const low = ctx.createBiquadFilter();
  low.type = "lowpass";
  low.frequency.setValueAtTime(160, t);
  low.frequency.exponentialRampToValueAtTime(980, t + 0.08);
  low.frequency.exponentialRampToValueAtTime(420, t + 0.34);
  low.frequency.exponentialRampToValueAtTime(180, t + dur);
  const mid = ctx.createBiquadFilter();
  mid.type = "bandpass";
  mid.Q.setValueAtTime(0.85, t);
  mid.frequency.setValueAtTime(320, t);
  mid.frequency.exponentialRampToValueAtTime(1680, t + 0.16);
  mid.frequency.exponentialRampToValueAtTime(540, t + dur);
  const high = ctx.createBiquadFilter();
  high.type = "highpass";
  high.frequency.setValueAtTime(2400, t);
  const lowG = ctx.createGain(); lowG.gain.value = 0.62;
  const midG = ctx.createGain(); midG.gain.value = 0.34;
  const highG = ctx.createGain(); highG.gain.value = 0.07;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, t);
  master.gain.exponentialRampToValueAtTime(0.16, t + 0.04);
  master.gain.exponentialRampToValueAtTime(0.12, t + 0.18);
  master.gain.exponentialRampToValueAtTime(0.09, t + 0.55);
  master.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const sub = ctx.createOscillator();
  sub.type = "sine";
  sub.frequency.setValueAtTime(78, t);
  sub.frequency.exponentialRampToValueAtTime(36, t + dur);
  const subG = ctx.createGain();
  subG.gain.setValueAtTime(0.0001, t);
  subG.gain.exponentialRampToValueAtTime(0.1, t + 0.05);
  subG.gain.exponentialRampToValueAtTime(0.045, t + 0.28);
  subG.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const crack = ctx.createBufferSource();
  crack.buffer = noiseBuffer(ctx);
  const crackF = ctx.createBiquadFilter();
  crackF.type = "bandpass";
  crackF.frequency.setValueAtTime(180, t);
  crackF.frequency.exponentialRampToValueAtTime(2200, t + 0.12);
  const crackG = ctx.createGain();
  crackG.gain.setValueAtTime(0.0001, t);
  crackG.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
  crackG.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  src.connect(low).connect(lowG).connect(master);
  src.connect(mid).connect(midG).connect(master);
  src.connect(high).connect(highG).connect(master);
  sub.connect(subG).connect(master);
  master.connect(ctx.destination);
  crack.connect(crackF).connect(crackG).connect(ctx.destination);
  src.start(t); sub.start(t); crack.start(t);
  src.stop(t + dur + 0.02); sub.stop(t + dur + 0.02); crack.stop(t + 0.3);
}
function resultSfx(passed) {
  const ctx = ensureAudio(); if (!ctx) return;
  (passed ? [523.25, 659.25, 783.99] : [392, 349.23, 293.66]).forEach((freq, i) => {
    const t = ctx.currentTime + i * 0.12, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = passed ? "triangle" : "sawtooth"; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t); gain.gain.exponentialRampToValueAtTime(0.05, t + 0.02); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    osc.connect(gain).connect(ctx.destination); osc.start(t); osc.stop(t + 0.3);
  });
}
function typeNodes(nodes) {
  const full = nodes.map((node) => node.textContent);
  nodes.forEach((node) => { node.textContent = ""; });
  typeState = { nodes: nodes, full: full, ni: 0, ci: 0, acc: 0 };
}
function stepType(dt) {
  if (!typeState) return;
  typeState.acc += Math.min(dt, 0.05) * 1000;
  while (typeState && typeState.acc >= 16) {
    typeState.acc -= 16;
    while (typeState.ni < typeState.nodes.length && typeState.ci >= typeState.full[typeState.ni].length) { typeState.ni += 1; typeState.ci = 0; }
    if (typeState.ni >= typeState.nodes.length) { typeState = null; return; }
    const ch = typeState.full[typeState.ni][typeState.ci];
    typeState.nodes[typeState.ni].textContent += ch;
    typeTick(ch); typeState.ci += 1;
  }
}
function stepSay(dt) {
  if (!sayState || sayState.done) return;
  sayState.acc += Math.min(dt, 0.05) * 1000;
  while (sayState && !sayState.done && sayState.acc >= 20) {
    sayState.acc -= 20;
    if (sayState.ci >= sayState.full.length) {
      sayState.done = true;
      if (sayState.status) setStatus(sayState.status);
      return;
    }
    const ch = sayState.full[sayState.ci];
    sayState.el.textContent += ch;
    typeTick(ch);
    sayState.ci += 1;
  }
}
function loop() {
  requestAnimationFrame(loop);
  if (!worldOk) return;
  const dt = Math.min(0.05, animClock.getDelta());
  if (planet) planet.rotation.y += dt * 0.05;
  if (clouds) clouds.rotation.y += dt * 0.02;
  stepCraft(dt);
  stepShip(dt);
  stepNose();
  applyView();
  stepBoom(dt);
  stepType(dt);
  stepSay(dt);
  if (successAt && sayState && sayState.done && !reportOpen && performance.now() >= successAt) {

    showResult();
  }
  renderer.render(scene, camera);
}
let animClock = { getDelta: function () { return 0.016; } };
if (!window.THREE) setStatus("Connect, then refresh.");
else { animClock = new THREE.Clock(); boot(); }
