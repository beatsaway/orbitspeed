<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rover missions</title>
<style>
  :root { --ink:#172033; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1a0e0c; color:#f4efe6; font-family:"Segoe UI", sans-serif; }
  canvas { display:block; position:fixed; inset:0; z-index:0; }
  #vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.45) 100%); }
  #nextReady.hide { display:none; }
  #nextReady {
    position:fixed; z-index:10; left:50%; bottom:22px; transform:translateX(-50%);
    padding:12px 22px; font-size:1.05rem; box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  #detailBtn {
    position:fixed; z-index:5; top:14px; left:50%; transform:translateX(-50%);
    padding:6px 14px; border:1px solid #2a6a88; border-radius:999px;
    background:rgba(8,9,12,.9); color:#f4efe6; font:inherit; font-size:.85rem; cursor:pointer;
  }
  #detailBtn.hide { display:none; }
  #tipBox.hide { display:none; }
  #tipBox {
    position:fixed; z-index:6; width:min(280px, 92vw); pointer-events:none;
    background:#fff; color:var(--ink); border-radius:14px; padding:10px 12px;
    box-shadow:0 8px 20px rgba(0,0,0,.28); font-size:.95rem; font-weight:600; line-height:1.35;
  }
  #tipBox b { display:block; margin-bottom:3px; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#8a4b2a; }
  #panel { position:fixed; z-index:4; top:14px; left:14px; width:min(360px, 94vw); max-height:calc(100vh - 28px); overflow:auto; background:rgba(16,36,63,.9); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:14px 14px 12px; }
  .kicker { margin:0; letter-spacing:.12em; text-transform:uppercase; font-size:.72rem; color:#e7b197; font-weight:700; }
  h1 { margin:4px 0 6px; font-size:1.45rem; }
  .hint, .rule { margin:0 0 8px; font-size:.98rem; line-height:1.35; }
  .rule { color:#f0c14a; font-weight:700; }
  .slide { margin:8px 0; }
  .slide label { display:flex; justify-content:space-between; gap:8px; font-size:.98rem; font-weight:700; }
  input[type=range] { width:100%; margin-top:4px; accent-color:#f0c14a; }
  button { border:0; border-radius:999px; padding:10px 16px; font:700 1rem "Segoe UI", sans-serif; cursor:pointer; background:#fff; color:var(--ink); }
  button:disabled { opacity:.45; cursor:default; }
  #hud { position:fixed; z-index:4; top:14px; right:16px; width:min(280px, 46vw); background:rgba(16,36,63,.9); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:12px; }
  .row { display:flex; justify-content:space-between; gap:10px; margin:3px 0; font-size:.92rem; }
  .row span { color:#e7d7c8; }
  .row b { font-variant-numeric:tabular-nums; }
  .row b.ok { color:#86efac; }
  .row b.bad { color:#ff8b8b; }
  #meters { margin:8px 0 0; font-size:.95rem; }
  #live { margin-top:8px; }
  #live.hide { display:none; }
  .bar { display:grid; grid-template-columns:92px 1fr 74px; gap:6px; align-items:center; font-size:.82rem; margin:4px 0; }
  #lifeNote { margin:2px 0 0; font-size:.75rem; line-height:1.3; color:#e7d7c8; }
  .track { height:10px; background:rgba(0,0,0,.35); border-radius:99px; overflow:hidden; }
  .fill { height:100%; width:0; border-radius:99px; }
  .fill.bat { background:#7dcea0; }
  .fill.dura { background:#e0b07a; }
  .fill.extra { background:#8eb4d4; }
  #b3row.hide { display:none; }
  #clock { margin:6px 0 0; font-size:1rem; font-weight:700; }
  #shade, #report, #ending, #intro { position:fixed; inset:0; z-index:8; background:rgba(7,17,28,.72); display:flex; align-items:center; justify-content:center; }
  #ending, #intro { z-index:9; }
  #shade.hide, #report.hide, #ending.hide, #intro.hide { display:none; }
  .popup { background:#071018; border:1px solid #2a6a88; border-radius:16px; padding:16px; width:min(480px, 92vw); max-height:min(88vh, 760px); overflow:auto; line-height:1.45; }
  .popup h2 { margin:0 0 8px; font-size:1.35rem; }
  .popup p { margin:0 0 8px; }
  .popup button { width:100%; margin-top:8px; }
  .popup img.art { width:100%; height:150px; object-fit:cover; border-radius:12px; margin:0 0 10px; display:block; background:#1a100c; }
  .meter-top { display:flex; justify-content:space-between; gap:8px; font-size:.88rem; }
  .meter-top b { font-variant-numeric:tabular-nums; }
  .scale { position:relative; height:12px; background:rgba(0,0,0,.4); border-radius:99px; margin:4px 0 2px; }
  .scale i { display:block; height:100%; width:0; border-radius:99px; background:#ff8b8b; }
  .scale i.met { background:#7dcea0; }
  .scale i.high { background:#f0c14a; }
  .scale em { position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:#fff; }
  .ladder { display:flex; gap:4px; margin:2px 0 10px; }
  .ladder span { flex:1; text-align:center; font-size:.68rem; color:#8ea0b0; border-top:3px solid #243444; padding-top:3px; }
  .ladder span.on { color:#f4efe6; border-top-color:#f0c14a; font-weight:700; }
  #mood { position:fixed; z-index:5; right:16px; bottom:14px; display:flex; align-items:flex-end; gap:8px; pointer-events:none; }
  #moodSay { margin:0 0 18px; max-width:240px; background:#fff; color:var(--ink); border-radius:16px 16px 4px 16px; padding:10px 12px; font-size:1rem; font-weight:700; line-height:1.3; }
  #moodFace { font-size:84px; line-height:1; filter:drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="vignette"></div>
<button type="button" id="detailBtn">Mission 1</button>
<div id="panel">
  <p class="kicker" id="kicker">Mission 1 of 7</p>
  <h1 id="title">Sun day</h1>
  <p class="rule">Score = Mars days × km</p>
  <p class="rule" id="need"></p>
  <div id="sliders"></div>
  <p class="hint" id="hint"></p>
  <button id="go" type="button">Launch</button>
</div>
<button type="button" id="nextReady" class="hide">Next mission</button>
<div id="hud">
  <div class="row"><span>Grant</span><b id="grant"></b></div>
  <div class="row"><span>Savings</span><b id="savings"></b></div>
  <div class="row"><span>Debt</span><b id="debt"></b></div>
  <div class="row"><span>Rover cost</span><b id="cost"></b></div>
  <div id="live" class="hide">
    <div class="bar"><span id="b1n">Battery</span><div class="track"><div class="fill bat" id="b1"></div></div><span id="b1v">Full</span></div>
    <p id="lifeNote">How long it can keep working.</p>
    <div class="bar"><span id="b2n">Durability</span><div class="track"><div class="fill dura" id="b2"></div></div><span id="b2v">Tough</span></div>
    <p id="duraNote">How much dust and sand it can still take.</p>
    <div class="bar hide" id="b3row"><span id="b3n">Warmth</span><div class="track"><div class="fill extra" id="b3"></div></div><span id="b3v">0</span></div>
    <p id="clock">Mars day 0</p>
    <p id="meters">0 km</p>
  </div>
</div>
<div id="mood">
  <p id="moodSay">The rover is waiting for a plan.</p>
  <div id="moodFace">🙂</div>
</div>
<div id="tipBox" class="hide"><b id="tipLabel">Tip</b><span id="tipText"></span></div>
<div id="intro" class="hide">
  <div class="popup">
    <p class="kicker">Chinese space agency</p>
    <h2>Your post</h2>
    <img id="introArt" class="art" src="art/intro-lab.webp" alt="A scientist at a design desk, with Mars beyond the window">
    <div id="introParas"></div>
    <button type="button" id="introOk">Begin</button>
  </div>
</div>
<div id="shade" class="hide">
  <div class="popup">
    <p class="kicker" id="briefKicker">Mission</p>
    <h2 id="briefTitle"></h2>
    <img id="briefArt" class="art" alt="">
    <div id="briefParas"></div>
    <button type="button" id="briefOk">Ready</button>
  </div>
</div>
<div id="report" class="hide"></div>
<div id="ending" class="hide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function pack(sols, km, cost, line, dust0, dust1, opt) {
  opt = opt || {};
  sols = Math.max(0, Math.round(sols));
  km = Math.max(0, Math.round(km * 10) / 10);
  const unit = opt.unit || "day";
  return {
    sols, km, score: Math.round(sols * km), cost: Math.round(cost * 10) / 10, line, unit,
    span: unit === "year" ? Math.max(0, Math.round(sols / 300)) : sols,
    dust0, dust1,
    bat0: opt.bat0 == null ? 100 : opt.bat0,
    bat1: opt.bat1 == null ? 40 : opt.bat1,
    lifeName: opt.lifeName || "Battery",
    lifeNote: opt.lifeNote || "How long the battery can keep working.",
    meter: opt.meter || "Dust",
    m0: opt.m0 == null ? Math.round(dust0 * 100) : opt.m0,
    m1: opt.m1 == null ? Math.round(dust1 * 100) : opt.m1
  };
}
function lifeWord(n) {
  if (n >= 78) return "Full";
  if (n >= 52) return "Good";
  if (n >= 30) return "Low";
  return "Gone";
}
function duraWord(n) {
  if (n >= 75) return "Tough";
  if (n >= 50) return "Scratched";
  if (n >= 28) return "Worn";
  return "Breaking";
}
const PACK_NOTE = "How long the nuclear pack can keep working.";
function mSun(panels, bat, kmDay) {
  const mass = 6 + panels * 1.5 + bat * 1.1;
  const power = 7 + panels * 5;
  const use = kmDay * 0.9 * (mass / 9);
  let sols, km;
  if (use > power + 1) { sols = 10 + bat * 4; km = sols * kmDay * 0.06; }
  else {
    sols = Math.max(20, 55 + panels * 14 + bat * 8 - kmDay * 2.2);
    km = sols * kmDay * 0.08 * (power / (power + use * 0.35)) * (11 / mass);
  }
  let line = "Dust settled on the blue glass, and the battery still had enough for the drives.";
  if (use > power + 1) line = "The daily drive needed more power than the panels and the battery could give.";
  else if (kmDay >= 10) line = "The long drives each day covered a lot of ground, and the battery was the limit.";
  return pack(sols, km, 8 + panels * 3 + bat * 2.2 + kmDay * 0.4, line, 0.15, 0.72, {
    bat0: 100, bat1: use > power + 1 ? 8 : Math.round(clamp(82 - kmDay * 3.2, 22, 74)),
    meter: "Dust", m0: 12, m1: 74
  });
}
function mStorm(panels, bat, kmDay) {
  const supply = 2.2 + panels * 1.5;
  const daily = kmDay * 1.1 + 3.2;
  const sols = daily <= supply + 0.2 ? 28 + bat * 8 : clamp(bat * 14 / (daily - supply), 4, 80);
  const km = sols * kmDay * 0.16;
  let line = "The brown sky hid most of the sun, and the battery carried the rover through.";
  if (kmDay === 0) line = "The rover waited out the storm, and the wheels never turned.";
  else if (sols < 12) line = "Driving under that weak sun used up the battery.";
  return pack(sols, km, 8 + panels * 2.6 + bat * 2.5 + kmDay * 0.35, line, 0.45, 0.9, {
    bat0: 100, bat1: sols < 12 ? 6 : Math.round(clamp(76 - kmDay * 5, 18, 68)),
    meter: "Sunlight", m0: 38, m1: kmDay === 0 ? 18 : 8
  });
}
function mNight(heater, bat, kmNight) {
  const cold = Math.max(0, 4 - heater);
  const draw = 2.1 + heater * 0.7 + kmNight * 0.62;
  let sols;
  if (heater < 2) sols = 6 + bat;
  else if (draw <= 4.95) sols = 22 + bat * 8;
  else sols = clamp(bat * 22 / (draw - 4.8), 6, 100);
  sols = sols / (1 + cold * 0.35);
  const km = sols * kmNight * 0.11 * (heater < 2 ? 0.3 : 1);
  let line = "The night heater and the kilometres after dark shared one battery.";
  if (heater < 2) line = "The night heater was too small, and the cold reached the computer.";
  else if (kmNight === 0) line = "The night heater kept it warm, and the rover stayed where it landed.";
  else if (draw > 7.4) line = "The night heater and the driving used up the battery, so the rover did not wake.";
  return pack(sols, km, 7 + heater * 1.3 + bat * 2.4 + kmNight * 0.45, line, 0.05, 0.2, {
    bat0: 100, bat1: draw > 7.4 || heater < 2 ? 8 : Math.round(clamp(84 - heater * 5 - kmNight * 3, 20, 70)),
    meter: "Warmth", m0: 55, m1: heater < 2 ? 8 : 64
  });
}
function mRidge(wheels, motor, bat) {
  const climb = 0.4 + wheels * 0.35 + motor * 0.3;
  const use = wheels * 0.7 + motor * 1.1 + climb * 0.4;
  const supply = 4 + bat * 2.2;
  const sols = use > supply ? 8 + bat * 2 : 30 + bat * 6 + (supply - use) * 2;
  const km = sols * climb * 0.18 * (12 / (8 + wheels + motor));
  let line = "The wheels and the motor took the rover up the ridge.";
  if (use > supply) line = "The climb needed more power than the battery held.";
  else if (wheels <= 2 && motor <= 2) line = "Small wheels made a slow climb, and the battery lasted.";
  return pack(sols, km, 8 + wheels * 2.2 + motor * 2.5 + bat * 2, line, 0.1, 0.35, {
    bat0: 100, bat1: use > supply ? 8 : Math.round(clamp(80 - use * 3, 24, 72)),
    meter: "Power", m0: 78, m1: use > supply ? 12 : 40
  });
}
function mNuke(packSize, kmDay, tools) {
  let watts = 22 + packSize * 15;
  const mass = 8 + packSize * 4.2 + tools * 0.3;
  let years = 0, km = 0;
  const record = clamp(tools / 4, 0.15, 1);
  while (years < 16) {
    const need = 7 + mass * 0.16 + kmDay * 2.6 + tools * 2.4;
    if (watts < need) break;
    km += kmDay * 0.62 * record * (14 / mass);
    watts *= 0.93;
    years += 1;
  }
  let line = "The instruments and the kilometres each day shared the weakening pack.";
  if (years === 0) line = "The drive and the instruments needed more power than the pack could give.";
  else if (tools <= 0) line = "The pack lasted, but almost none of the drive was recorded.";
  else if (tools >= 6) line = "The instruments stayed on, so the pack had less power left for the wheels.";
  return pack(years * 300, km, 6 + packSize * 6.5 + kmDay * 0.4 + tools * 0.7, line, 0.05, 0.15, {
    unit: "year", bat0: 100, bat1: years === 0 ? 6 : Math.round(clamp(96 - years * 4, 16, 78)),
    lifeName: "Pack", lifeNote: PACK_NOTE,
    meter: "Pack output", m0: 100, m1: years === 0 ? 6 : Math.max(12, 100 - years * 4)
  });
}
function mDrill(packSize, hours, kmHop) {
  let watts = 22 + packSize * 14;
  const mass = 10 + packSize * 4 + hours * 0.5;
  let years = 0, km = 0;
  while (years < 12) {
    const need = 8 + mass * 0.15 + hours * 4.2 + kmHop * 2.2;
    if (watts < need) break;
    km += kmHop * 0.85 * (15 / mass);
    watts *= 0.92;
    years += 1;
  }
  let line = "The drill and the drives between holes shared the nuclear pack.";
  if (years === 0) line = "The drilling and the drive needed more power than the pack had.";
  else if (hours >= 6) line = "Long hours of drilling used up the pack, so the route stayed short.";
  else if (hours <= 1) line = "The drill hardly ran, and the pack lasted.";
  return pack(years * 300, km, 7 + packSize * 5 + hours * 0.9 + kmHop * 0.35, line, 0.08, 0.2, {
    unit: "year", bat0: 100, bat1: years === 0 ? 6 : Math.round(clamp(94 - years * 5, 14, 76)),
    lifeName: "Pack", lifeNote: PACK_NOTE,
    meter: "Drill use", m0: 30, m1: years === 0 ? 90 : Math.round(clamp(20 + hours * 10, 20, 88))
  });
}
function mBall(kmDay, shrink, ribs) {
  const size = 6 - shrink;
  const sail = size * 0.16 + ribs * 0.12;
  const dust = size * 0.12 + ribs * 0.08;
  const days = Math.max(4, 26 + shrink * 14 - dust * 22 - kmDay * 1.6);
  const roll = kmDay * sail / (1 + dust * 0.45);
  const km = days * roll * 0.12;
  let line = "The wind rolled the ball. The ribs caught the gusts, and they caught dust too.";
  if (days < 12) line = "The large shell caught the wind, and the dust stopped it early.";
  else if (shrink >= 4) line = "The ball pulled in tight. Dust hit less of it, and the wind had less to push.";
  return pack(days, km, 10 + kmDay * 0.35 + size * 0.8 + ribs * 0.7, line, 0.2, clamp(dust, 0.1, 0.9), {
    bat0: 100, bat1: Math.round(clamp(28 + shrink * 14 - ribs * 6 - kmDay, 8, 92)),
    lifeName: "Shell", lifeNote: "How long the shell can keep rolling.",
    meter: "Dust on shell", m0: 18, m1: Math.round(clamp(dust * 110, 12, 92))
  });
}

const MISSIONS = [
  {
    title: "Sun day", kind: "sun", amp: 1, ridge: 0.6, art: "art/brief-01-sun.webp",
    needDays: 90, needKm: 30,
    brief: [
      "This rover runs on sunlight. A Mars day is one sunrise to the next. It is a little longer than a day on Earth.",
      "More solar panels catch more sun, and they cost more. A bigger battery stores power for the drive. More kilometres each day go further, but the battery runs down sooner.",
      "Dust slowly settles on the glass as the Mars days pass."
    ],
    sky: 0xb86a4a, fog: 0.008, sun: 1, stars: 0.08, wind: 0.45,
    sliders: [
      { key: "p", label: "Solar panels", min: 1, max: 5, step: 1, value: 3, tip: "More panels catch more sunlight. They cost more, and they make the rover heavier, so each drive uses a little more power." },
      { key: "b", label: "Battery", min: 1, max: 5, step: 1, value: 3, tip: "A bigger battery keeps the rover going for more Mars days. It costs more, and the extra weight uses a little more power." },
      { key: "k", label: "Kilometres each day", min: 2, max: 12, step: 1, value: 6, unit: " km", tip: "A longer drive covers more ground, and it uses the battery faster. If the drive is too long, the rover can stop early." }
    ],
    run: (v) => mSun(v.p, v.b, v.k)
  },
  {
    title: "Dust storm", kind: "storm", amp: 0.7, ridge: 0.3, art: "art/brief-02-storm.webp",
    needDays: 45, needKm: 18,
    brief: [
      "A dust storm turns the sky brown, so the sunlight is weak.",
      "The solar panels still help a little. The battery is what keeps the rover going while the light is poor.",
      "Kilometres in the storm use that battery. Choose zero and the rover waits. It does not travel."
    ],
    sky: 0x8a4528, fog: 0.042, sun: 0.28, stars: 0, wind: 1,
    sliders: [
      { key: "p", label: "Solar panels", min: 1, max: 5, step: 1, value: 3, tip: "In a dust storm the sun is weak, so extra panels only help a little. They still cost money." },
      { key: "b", label: "Battery", min: 1, max: 6, step: 1, value: 4, tip: "The battery carries the rover while the sky is brown. A larger one lasts more Mars days, and it costs more." },
      { key: "k", label: "Kilometres in the storm", min: 0, max: 8, step: 1, value: 3, unit: " km", tip: "Driving in the storm uses the battery. Set this to zero and the rover waits. It does not travel." }
    ],
    run: (v) => mStorm(v.p, v.b, v.k)
  },
  {
    title: "Cold night", kind: "night", amp: 0.85, ridge: 0.4, art: "art/brief-03-night.webp",
    needDays: 40, needKm: 14,
    brief: [
      "Mars nights fall to about −130°C. The night heater stops the computer from cracking in that cold, and it uses the battery.",
      "Kilometres after dark use more of the same battery.",
      "A small night heater lets the cold in. A large night heater, together with driving, can use up the battery so the rover does not wake."
    ],
    sky: 0x140e18, fog: 0.02, sun: 0, stars: 0.95, wind: 0.12,
    sliders: [
      { key: "h", label: "Night heater", min: 0, max: 8, step: 1, value: 4, tip: "The heater keeps the computer safe at about \u2212130\u00b0C. A small heater lets the cold in. A large one uses a lot of the battery." },
      { key: "b", label: "Battery", min: 2, max: 8, step: 1, value: 5, tip: "One battery feeds the night heater and the drive. A bigger battery lasts longer, and it costs more." },
      { key: "k", label: "Kilometres after dark", min: 0, max: 8, step: 1, value: 3, unit: " km", tip: "Driving after dark uses the same battery as the heater. A long drive and a strong heater together can stop the rover." }
    ],
    run: (v) => mNight(v.h, v.b, v.k)
  },
  {
    title: "Up the ridge", kind: "ridge", amp: 1.7, ridge: 1.4, art: "art/brief-04-ridge.webp",
    needDays: 55, needKm: 20,
    brief: [
      "The route climbs a ridge. Bigger wheels grip the slope. A stronger motor pulls the rover up.",
      "Wheels and motor both use power, and they add weight. The battery has to last the whole climb.",
      "A light rover climbs slowly. A heavy one can stop if the battery is too small."
    ],
    sky: 0xd4896a, fog: 0.014, sun: 0.85, stars: 0.1, wind: 0.22,
    sliders: [
      { key: "w", label: "Wheel size", min: 1, max: 5, step: 1, value: 3, tip: "Bigger wheels grip the slope. They are heavier, so the climb uses more power." },
      { key: "m", label: "Motor", min: 1, max: 5, step: 1, value: 3, tip: "A stronger motor pulls the rover up the ridge. It uses more of the battery." },
      { key: "b", label: "Battery", min: 2, max: 8, step: 1, value: 4, tip: "The battery has to last the whole climb. If it is too small for the wheels and the motor, the rover stops." }
    ],
    run: (v) => mRidge(v.w, v.m, v.b)
  },
  {
    title: "Nuclear pack", kind: "nuke", amp: 1, ridge: 0.5, art: "art/brief-06-nuke.webp",
    needYears: 6, needKm: 12,
    brief: [
      "This rover has no solar panels. A nuclear pack makes electricity from its own heat, and that heat keeps the rover warm. The pack gets weaker every year.",
      "Kilometres each day are the drive. Instruments are the cameras and tools. They stay switched on, so they use power as well as the wheels.",
      "If the instruments are off, almost none of the drive counts towards the mission."
    ],
    sky: 0x3a2430, fog: 0.02, sun: 0.22, stars: 0.7, wind: 0.15,

    const tint = new THREE.Color(0xd7c4a4).lerp(new THREE.Color(0x8a6244), clamp(dust, 0, 1) * 0.8);

    rover.userData.panelMat.color.copy(tint);

  }
  const night = world.look.kind === "night";
  const nuclear = world.look.kind === "nuke" || world.look.kind === "warm" || world.look.kind === "drill";
  if (fillLight) {
    fillLight.position.set(x, y + 1.4, z);
    fillLight.intensity = night ? 2.4 : (world.look.kind === "wear" ? 0.7 : (nuclear ? 1.1 : 0));
  }
  const pulse = 0.9 + Math.sin(performance.now() * 0.0016) * 0.05;
  if (glowCore) glowCore.material.opacity = nuclear ? pulse : 0;
  if (glowHeat) {
    const on = night || world.look.kind === "wear";

function blowDust(x, z, moving) {
  const pos = dustPts.pos;
  const wind = world.look.wind;
  const night = world.look.kind === "night";
  for (let i = 0; i < dustPts.count; i++) {
    let px = pos[i * 3], py = pos[i * 3 + 1], pz = pos[i * 3 + 2];
    px += (night ? 0.015 : 0.06 + wind * 0.16);
    if (!night) py += Math.sin(px * 0.4 + i) * 0.008;
    if (world.look.kind === "storm") {
      const spin = i * 0.15 + performance.now() * 0.0015;
      px += Math.cos(spin) * 0.03;
      pz += Math.sin(spin) * 0.03;
    }
    if (px > x + 24) px -= 46;
    if (px < x - 24) px += 46;
    if (py > 8) py = 0.15;
    if (py < 0.05) py = 0.2;
    if (pz > z + 18) pz -= 36;
    if (pz < z - 18) pz += 36;
    pos[i * 3] = px; pos[i * 3 + 1] = py; pos[i * 3 + 2] = pz;
  }
  dustPts.pts.geometry.attributes.position.needsUpdate = true;
  const puff = puffPts.pos;
  for (let i = 0; i < puffPts.count; i++) {
    puff[i * 3 + 1] += 0.03;
    puff[i * 3] -= 0.04;
    if (!moving || puff[i * 3 + 1] > 1.4) {
      puff[i * 3] = x - 1.2 + Math.random() * 0.4;
      puff[i * 3 + 1] = 0.15 + Math.random() * 0.2;
      puff[i * 3 + 2] = z + (Math.random() - 0.5) * 1.3;
    }
  }
  puffPts.pts.material.opacity = moving ? 0.4 : 0.05;
  puffPts.pts.geometry.attributes.position.needsUpdate = true;
}

function judge(res, m) {
  const gotTime = res.unit === "year" ? res.span : res.sols;

  const kmRatio = res.km / m.needKm;

  else if (dayRatio < 1 || kmRatio < 1) id = "below";

  else if (dayRatio >= 1.45 && kmRatio >= 1.45) id = "great";
  return { id, passed: id === "ok" || id === "great" || id === "miracle", dayRatio, kmRatio, gotTime, needTime };
}

function campaignStanding() {

  const ratio = refSum ? totalScore / refSum : 1;
  let pts = 0;
  history.forEach((h) => {
    if (h.tier === "A miracle") pts += 3;
    else if (h.tier === "Excellent") pts += 2;
    else pts += 1;
  });
  const avg = history.length ? pts / history.length : 1;
  const byTier = avg >= 2.4 ? "outstanding" : avg >= 1.4 ? "strong" : "steady";
  const byScore = ratio >= 1.75 ? "outstanding" : ratio >= 1.22 ? "strong" : "steady";
  const rank = { steady: 0, strong: 1, outstanding: 2 };
  return rank[byTier] >= rank[byScore] ? byTier : byScore;

function applyOrbit() {

  const target = new THREE.Vector3(0.2, y, 0);
  const sp = Math.sin(orbit.phi);
  camera.position.set(
    target.x + orbit.radius * sp * Math.sin(orbit.theta),
    target.y + orbit.radius * Math.cos(orbit.phi),

function bindOrbit() {

    orbit.ly = e.clientY;
    el.setPointerCapture(e.pointerId);
  });

    if (!orbit.dragging) return;
    orbit.theta -= (e.clientX - orbit.lx) * 0.008;
    orbit.phi = clamp(orbit.phi + (e.clientY - orbit.ly) * 0.006, 0.38, 1.32);
    orbit.lx = e.clientX;
    orbit.ly = e.clientY;
    applyOrbit();
  });
  el.addEventListener("pointerup", () => { orbit.dragging = false; });

  const x = rover.position.x;
  const z = rover.position.z;
  const y = placeRover.sy == null ? rover.position.y : placeRover.sy;
  const ball = world.look.kind === "ball";
  camWant.set(x - (ball ? 4.2 : 6.4), y + (ball ? 2.2 : 2.8), z + (ball ? 3.4 : 5.2));
  lookAt.set(x + (ball ? 1.2 : 2.4), y + 0.85, z);
  if (camMode === "blend") {
    blendT += dt;
    const k = clamp(blendT / 1.35, 0, 1);
    const e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(blendFrom, camWant, e);
    blendTmp.copy(blendLook).lerp(lookAt, e);
    camera.lookAt(blendTmp);
    if (k >= 1) camMode = "follow";
  } else if (camMode === "follow") {
    camera.position.lerp(camWant, Math.min(0.28, 1 - Math.pow(0.001, dt)));
    camera.lookAt(lookAt);
  }
}
function loop() {
  requestAnimationFrame(loop);
  if (!worldOk) return;
  const dt = Math.min(0.05, animClock.getDelta());
  if (play) {
    play.t += dt;
    const u = Math.min(1, play.t / 14);
    showLive(play.res, u, dt);
    updateCamera(dt);
    if (u >= 1) {
      const res = play.res;
      play = null;
      showResult(res);
    }
  } else if (rover && camMode !== "hold") {
    placeRover(rover.position.x, rover.userData.dust == null ? 0.15 : rover.userData.dust, false, dt);
  }
  stepType(dt);
  stepQuip(dt);
  renderer.render(scene, camera);
}
window.addEventListener("resize", () => {
  if (!renderer) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.getElementById("nextReady").addEventListener("click", () => {
  ensureAudio();
  clickSfx();
  if (play) {
    const res = play.res;
    play = null;
    showResult(res);
    return;
  }
  if (!document.getElementById("report").classList.contains("hide")) advance();
});
document.getElementById("detailBtn").addEventListener("click", () => {
  ensureAudio();
  clickSfx();
  if (!introDone) return;
  openBrief();
});
document.getElementById("briefOk").addEventListener("click", () => {
  ensureAudio();
  clickSfx();
  document.getElementById("shade").classList.add("hide");
  typeState = null;
});
document.getElementById("introOk").addEventListener("click", () => {
  ensureAudio();
  clickSfx();
  introDone = true;
  document.getElementById("intro").classList.add("hide");
  typeState = null;
  openBrief();
});
document.getElementById("panel").addEventListener("scroll", hideTip);
let audioCtx = null;
let typeState = null;
let quipState = null;
let driveNodes = null;
function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function clickSfx() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(740, t);
  gain.gain.setValueAtTime(0.028, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.06);
}
function typeTick(ch) {
  if (!audioCtx || audioCtx.state !== "running") return;
  if (!ch || !/[A-Za-z0-9]/.test(ch)) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();
  const notes = [659.25, 783.99, 880, 987.77];
  const freq = notes[(Math.random() * notes.length) | 0] * (0.97 + Math.random() * 0.06);
  osc.type = "square";
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(200, freq * 0.78), t + 0.03);
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(1100, t);
  filter.Q.setValueAtTime(1.2, t);
  gain.gain.setValueAtTime(0.035, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.032);
  osc.connect(filter).connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.04);
}
function noiseBuffer(seconds) {
  const ctx = ensureAudio();
  if (!ctx) return null;
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}
function startDrive() {
  stopDrive();
  const ctx = ensureAudio();
  if (!ctx) return;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(1.5);
  src.loop = true;
  const low = ctx.createBiquadFilter();
  low.type = "lowpass";
  low.frequency.value = world.look.kind === "ball" || world.look.kind === "storm" ? 900 : 240;
  const gain = ctx.createGain();
  gain.gain.value = world.look.kind === "storm" ? 0.045 : 0.03;
  src.connect(low).connect(gain).connect(ctx.destination);
  src.start();
  driveNodes = { src: src, gain: gain };
}
function stopDrive() {
  if (!driveNodes) return;
  const ctx = audioCtx;
  const now = ctx ? ctx.currentTime : 0;
  try {
    driveNodes.gain.gain.cancelScheduledValues(now);
    driveNodes.gain.gain.setValueAtTime(driveNodes.gain.gain.value, now);
    driveNodes.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    driveNodes.src.stop(now + 0.28);
  } catch (e) {}
  driveNodes = null;
}
function launchSfx() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(160, t);
  osc.frequency.exponentialRampToValueAtTime(480, t + 0.4);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.05, t + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.52);
  startDrive();
}
function resultSfx(passed) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const notes = passed ? [523.25, 659.25, 783.99] : [392, 349.23, 293.66];
  notes.forEach((freq, i) => {
    const t = ctx.currentTime + i * 0.12;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = passed ? "triangle" : "sawtooth";
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.3);
  });
}
function typeNodes(nodes) {
  const full = nodes.map((node) => node.textContent);
  nodes.forEach((node) => { node.textContent = ""; });
  typeState = { nodes: nodes, full: full, ni: 0, ci: 0, acc: 0 };
}
function stepType(dt) {
  if (!typeState) return;
  typeState.acc += Math.min(dt, 0.05) * 1000;
  while (typeState && typeState.acc >= 20) {
    typeState.acc -= 20;
    while (typeState.ni < typeState.nodes.length && typeState.ci >= typeState.full[typeState.ni].length) {
      typeState.ni += 1;
      typeState.ci = 0;
    }
    if (typeState.ni >= typeState.nodes.length) { typeState = null; return; }
    const ch = typeState.full[typeState.ni][typeState.ci];
    typeState.nodes[typeState.ni].textContent += ch;
    typeTick(ch);
    typeState.ci += 1;
  }
}
function stepQuip(dt) {
  if (!quipState) return;
  quipState.acc += Math.min(dt, 0.05) * 1000;
  while (quipState && quipState.acc >= 20) {
    quipState.acc -= 20;
    if (quipState.i >= quipState.full.length) { quipState = null; return; }
    const ch = quipState.full[quipState.i];
    quipState.el.textContent += ch;
    if (!typeState) typeTick(ch);
    quipState.i += 1;
  }
}
let animClock = { getDelta: function () { return 0.016; } };
if (!window.THREE) document.getElementById("hint").textContent = "The picture needs the internet once. Connect, then refresh.";
else { animClock = new THREE.Clock(); boot(); }
</script>
