<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seesaw</title>
  <style>
    :root { --ink: #e7f2ff; --muted: #9eb4c8; --line: #24384c; --cyan: #3de4ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07111c; color: var(--ink); font: 16px/1.45 "Segoe UI", sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; display: block; }
    a { color: var(--muted); font-size: 0.82rem; margin-right: 8px; }
    #bar { position: fixed; left: 16px; top: 14px; z-index: 2; }
    h1 { margin: 0 0 4px; font-size: 1.25rem; }
    #note { margin: 8px 0 0; max-width: 420px; color: var(--muted); font-size: 0.9rem; }
    #panel { position: fixed; left: 16px; bottom: 16px; z-index: 2; width: min(440px, calc(100% - 32px)); background: #0d1b2acc; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
    label { display: grid; grid-template-columns: 120px 1fr 36px; gap: 8px; align-items: center; font-size: 0.92rem; }
    output { color: var(--cyan); text-align: right; }
    button { margin-top: 4px; justify-self: start; font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 14px; background: var(--cyan); color: #041018; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bar">
    <h1>Seesaw</h1>
    <div><a href="index.html">Lesson</a><a href="tumbler.html">Tumbler</a><a href="plane.html">Plane</a></div>
    <p id="note">Size can be zero. Further from the middle, the same person pushes harder.</p>
  </div>
  <div id="panel">
    <label>Left size <input id="leftSize" type="range" min="0" max="2" step="0.01" value="1.4"><output id="leftSizeOut">1.40</output></label>
    <label>Left distance <input id="leftDist" type="range" min="0" max="2.2" step="0.01" value="1.3"><output id="leftDistOut">1.30</output></label>
    <label>Right size <input id="rightSize" type="range" min="0" max="2" step="0.01" value="0.7"><output id="rightSizeOut">0.70</output></label>
    <label>Right distance <input id="rightDist" type="range" min="0" max="2.2" step="0.01" value="1.3"><output id="rightDistOut">1.30</output></label>
    <button id="reposition" type="button">Reposition</button>
  </div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const HALF = 2.45;
    const PIVOT_Y = 1.45;
    const canvas = document.getElementById("view");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07111c);
    scene.add(new THREE.HemisphereLight(0xb9d4ff, 0x1b2430, 1));
    const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
    sun.position.set(4, 8, 6);
    scene.add(sun);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 50);
    camera.position.set(0.15, 2.15, 7.4);
    camera.lookAt(0, 1.05, 0);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 48), new THREE.MeshStandardMaterial({ color: 0x163024, roughness: 0.95 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    const fulcrum = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.55, PIVOT_Y, 4),
      new THREE.MeshStandardMaterial({ color: 0xc4a574 })
    );
    fulcrum.position.y = PIVOT_Y / 2;
    scene.add(fulcrum);
    const beam = new THREE.Group();
    const plank = new THREE.Mesh(
      new THREE.BoxGeometry(HALF * 2, 0.12, 0.72),
      new THREE.MeshStandardMaterial({ color: 0xd5e4f2 })
    );
    beam.add(plank);
    beam.position.y = PIVOT_Y;
    scene.add(beam);

    function makePerson(color) {
      const g = new THREE.Group();
      const cloth = new THREE.MeshStandardMaterial({ color, roughness: 0.65 });
      const skin = new THREE.MeshStandardMaterial({ color: 0xf0c7a0, roughness: 0.55 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.4, 0.2), cloth);
      body.position.y = 0.46;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 12), skin);
      head.position.y = 0.78;
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.26, 0.09), cloth);
      leg.position.set(-0.08, 0.13, 0.06);
      const leg2 = leg.clone();
      leg2.position.x = 0.08;
      g.add(body, head, leg, leg2);
      g.position.y = 0.06;
      beam.add(g);
      return g;
    }

    const left = makePerson(0x2f6fed);
    const right = makePerson(0x3d9a6a);
    const state = { leftSize: 1.4, leftDist: 1.3, rightSize: 0.7, rightDist: 1.3 };
    let angle = 0;
    let omega = 0;
    let hold = 0;

    document.getElementById("reposition").addEventListener("click", () => {
      angle = 0;
      omega = 0;
      hold = 0.7;
      beam.rotation.z = 0;
      document.getElementById("note").textContent = "Level again. Watch which side goes down.";
    });

    function bind(id, key) {
      const input = document.getElementById(id);
      const out = document.getElementById(id + "Out");
      input.addEventListener("input", () => {
        state[key] = Number(input.value);
        out.textContent = state[key].toFixed(2);
      });
    }
    bind("leftSize", "leftSize");
    bind("leftDist", "leftDist");
    bind("rightSize", "rightSize");
    bind("rightDist", "rightDist");

    function place(person, size, distance, side) {
      person.visible = size > 0.02;
      person.scale.setScalar(Math.max(size, 0.001));
      person.position.x = side * distance;
      person.position.y = 0.06;
    }

    function resize() {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / Math.max(innerHeight, 1);
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();
    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.033);
      place(left, state.leftSize, state.leftDist, -1);
      place(right, state.rightSize, state.rightDist, 1);
      const massL = state.leftSize ** 3;
      const massR = state.rightSize ** 3;
      const torque = massR * state.rightDist - massL * state.leftDist;
      if (hold > 0) hold = Math.max(0, hold - dt);
      else omega -= torque * 0.85 * dt;
      omega *= Math.exp(-2.2 * dt);
      angle += omega * dt;
      const limit = 0.34;
      if (angle > limit) { angle = limit; omega = Math.min(0, omega) * -0.2; }
      if (angle < -limit) { angle = -limit; omega = Math.max(0, omega) * -0.2; }
      beam.rotation.z = angle;
      const heavy = torque < -0.35 ? "Left side down." : torque > 0.35 ? "Right side down." : "Nearly level.";
      document.getElementById("note").textContent = hold > 0
        ? "Level again. Watch which side goes down."
        : heavy + " Size can be zero. Further from the middle pushes harder.";
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
