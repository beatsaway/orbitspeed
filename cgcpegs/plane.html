<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lathe plane</title>
  <style>
    :root { --ink: #e7f2ff; --muted: #9eb4c8; --line: #24384c; --cyan: #3de4ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07111c; color: var(--ink); font: 16px/1.45 "Segoe UI", sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; display: block; }
    a { color: var(--muted); font-size: 0.82rem; margin-right: 8px; }
    #bar { position: fixed; left: 16px; top: 14px; z-index: 2; }
    h1 { margin: 0 0 4px; font-size: 1.25rem; }
    #note { margin: 8px 0 0; max-width: 420px; color: var(--muted); font-size: 0.9rem; }
    #panel { position: fixed; left: 16px; bottom: 16px; z-index: 2; width: min(420px, calc(100% - 32px)); background: #0d1b2acc; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    label { display: grid; grid-template-columns: 90px 1fr 36px; gap: 8px; align-items: center; }
    output { color: var(--cyan); text-align: right; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
    #fly { background: var(--cyan); color: #041018; }
    #reset { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.45; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bar">
    <h1>Lathe plane</h1>
    <div><a href="index.html">Lesson</a><a href="tumbler.html">Tumbler</a><a href="seesaw.html">Seesaw</a></div>
    <p id="note">The body is spun on a lathe. A larger head pulls the magenta weight toward the nose, and the nose drops.</p>
  </div>
  <div id="panel">
    <label>Head <input id="head" type="range" min="0.4" max="2.4" step="0.01" value="1"><output id="headOut">1.00</output></label>
    <div class="actions">
      <button id="fly" type="button">Fly</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const LENGTH = 4.4;
    const WING_X = 2.2;
    const canvas = document.getElementById("view");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07111c);
    scene.fog = new THREE.Fog(0x07111c, 40, 120);
    scene.add(new THREE.HemisphereLight(0xb9d4ff, 0x1b2430, 1));
    const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
    sun.position.set(-4, 10, 6);
    scene.add(sun);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(-3, 2.4, 8);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 80), new THREE.MeshStandardMaterial({ color: 0x163024, roughness: 0.95 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    const grid = new THREE.GridHelper(240, 48, 0x2d5340, 0x1c3328);
    grid.position.y = 0.02;
    scene.add(grid);

    const craft = new THREE.Group();
    scene.add(craft);
    const parts = [];
    let head = 1;
    let cgX = 2;
    let flying = false;
    let x = 0;
    let y = 3.2;
    let pitch = 0.02;
    let pitchRate = 0;
    let vy = 0;

    function profile(size) {
      const headR = 0.16 + size * 0.28;
      return [
        new THREE.Vector2(0.02, 0),
        new THREE.Vector2(0.14, 0.22),
        new THREE.Vector2(0.26, 0.55),
        new THREE.Vector2(0.3, 1.15),
        new THREE.Vector2(0.3, 2.35),
        new THREE.Vector2(0.28, 2.7),
        new THREE.Vector2(headR, 3.25),
        new THREE.Vector2(headR * 0.72, 3.75),
        new THREE.Vector2(0.08, 4.15),
        new THREE.Vector2(0.01, LENGTH)
      ];
    }

    function measure(pts) {
      let mass = 0;
      let moment = 0;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1];
        const b = pts[i];
        const dy = b.y - a.y;
        if (dy <= 0) continue;
        const r = (a.x + b.x) / 2;
        const m = r * r * dy;
        mass += m;
        moment += m * (a.y + b.y) / 2;
      }
      return mass ? moment / mass : LENGTH / 2;
    }

    function addPart(mesh) {
      craft.add(mesh);
      parts.push(mesh);
    }

    function build() {
      parts.forEach((mesh) => {
        craft.remove(mesh);
        mesh.geometry.dispose();
      });
      parts.length = 0;
      const pts = profile(head);
      const geo = new THREE.LatheGeometry(pts, 32);
      geo.rotateZ(-Math.PI / 2);
      const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd5e4f2, metalness: 0.2, roughness: 0.42 }));
      addPart(body);
      cgX = measure(pts);
      const paint = new THREE.MeshStandardMaterial({ color: 0x8ec8ff, roughness: 0.45 });
      const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 1.85), paint);
      wingL.position.set(WING_X, 0.22, -1.25);
      wingL.rotation.x = 0.12;
      const wingR = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 1.85), paint);
      wingR.position.set(WING_X, 0.22, 1.25);
      wingR.rotation.x = -0.12;
      const stab = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.04, 1.35), paint);
      stab.position.set(0.42, 0.12, 0);
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.05), paint);
      fin.position.set(0.38, 0.48, 0);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffb703 }));
      nose.position.set(LENGTH - 0.02, 0, 0);
      const cgDot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 12), new THREE.MeshBasicMaterial({ color: 0xff2bd6 }));
      cgDot.position.set(cgX, 0.48, 0);
      [wingL, wingR, stab, fin, nose, cgDot].forEach(addPart);
      const ahead = cgX - WING_X;
      document.getElementById("note").textContent = ahead > 0.28
        ? "Large head. The weight is toward the nose, so the nose drops."
        : ahead < -0.05
          ? "Small head. The weight is behind the wing, so the nose climbs and tumbles."
          : "The weight sits near the wing. It should fly level, nose first.";
    }

    function park() {
      flying = false;
      x = 0;
      y = 2.6;
      pitch = 0.02;
      pitchRate = 0;
      vy = 0;
      document.getElementById("fly").disabled = false;
      document.getElementById("head").disabled = false;
      build();
    }

    document.getElementById("head").addEventListener("input", (e) => {
      if (flying) return;
      head = Number(e.target.value);
      document.getElementById("headOut").textContent = head.toFixed(2);
      build();
    });
    document.getElementById("fly").addEventListener("click", () => {
      flying = true;
      y = 3.2;
      pitch = 0.04;
      pitchRate = 0;
      vy = 0;
      document.getElementById("fly").disabled = true;
      document.getElementById("head").disabled = true;
    });
    document.getElementById("reset").addEventListener("click", park);

    function resize() {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / Math.max(innerHeight, 1);
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();
    park();
    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.033);
      if (flying) {
        const aoa = pitch - Math.atan2(vy, 8);
        const margin = cgX - WING_X;
        pitchRate += (-margin * aoa * 1.5 - (head - 1) * 0.38 - pitchRate * 1.2) * dt;
        pitch = Math.max(-0.7, Math.min(0.85, pitch + pitchRate * dt));
        vy += (Math.sin(pitch) * 6.5 - 0.25) * dt;
        x += 8 * dt;
        y += vy * dt;
        if (y < 1.15) {
          y = 1.15;
          vy = 0;
          pitchRate = 0;
          pitch = Math.max(pitch, -0.22);
          flying = false;
          document.getElementById("note").textContent = "It met the ground. Change the head and fly again.";
          document.getElementById("head").disabled = false;
        }
        if (x > 80) park();
      }
      craft.position.set(x, y, 0);
      craft.rotation.z = pitch;
      camera.position.lerp(new THREE.Vector3(x - 2.4, Math.max(y, 1.2) + 1.5, 7.2), flying ? 0.08 : 1);
      camera.lookAt(x + 1.6, y + 0.15, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
